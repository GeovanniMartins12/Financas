<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-ms-180.png">
<link rel="icon" href="icon-ms-192.png">
<title>Controle financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm personal money tool, direct, no props
   IDEA: a pocket ledger — one month per page, the leftover number first
   PICTURE: the month's result set large in a mint field, category bars under it
   COLOUR and TYPE: black/white plus mint #b8f5d0; Space Grotesk 700 numbers, Inter text
   LAYOUT: phone first; header with month switcher, content column, bottom tab bar, + button */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c0d0d);--ink:light-dark(#0b0b0b,#f1f3f2);--mute:light-dark(#5b625f,#9aa39f);
--line:light-dark(#e5e8e6,#262a29);--card:light-dark(#f4f6f5,#151817);
--hero:light-dark(#b8f5d0,#0f1d16);--heroink:light-dark(#0b0b0b,#b8f5d0);--mint:#b8f5d0;
--neg:light-dark(#c0322c,#ff7a72);--pos:light-dark(#11704a,#86e3ae);--warn:light-dark(#975200,#ffbe5c);
--in:light-dark(#2a9d68,#86e3ae);--out:light-dark(#0b0b0b,#e9ecea)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.big,.num{font-family:"Space Grotesk",Inter,sans-serif}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) max(4vw,14px) 8px}
.hd{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.hd h1{font-size:20px;margin:0;flex:1}
.mnav{display:flex;align-items:center;gap:2px}
.mnav b{font:600 15px Inter;min-width:118px;text-align:center;white-space:nowrap}
.ib{width:44px;height:44px;border:0;background:none;border-radius:12px;cursor:pointer;display:grid;place-items:center}
.ib:hover{background:var(--card)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
#mode{max-width:760px;margin:2px auto 0;font-size:13px;color:var(--mute)}
#note{max-width:760px;margin:6px auto 0;font-size:14px;color:var(--warn)}
main{max-width:760px;margin:0 auto;padding:16px max(4vw,14px) calc(130px + env(safe-area-inset-bottom))}
.hero{background:var(--hero);color:var(--heroink);border-radius:20px;padding:22px 20px 18px;margin:0 0 18px}
.lbl{font-size:13px;opacity:.8;display:block}
.big{font-size:clamp(38px,11vw,52px);line-height:1.05;font-weight:700;margin:4px 0 16px;white-space:nowrap}
.big.neg{color:var(--neg)}
.pair{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:1px solid color-mix(in srgb,currentColor 22%,transparent);padding-top:12px}
.pair b{font:600 16px "Space Grotesk",Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.blk{margin:22px 0}
.blk h2,.sec h2{font-size:18px;margin:0 0 10px}
.empty{color:var(--mute);padding:18px 0}
.callout{background:var(--card);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.alerts li{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;border-left:4px solid var(--warn)}
.alerts li.bad{border-left-color:var(--neg)}
.alerts li span{flex:1}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.bars li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .v{font:600 15px "Space Grotesk",Inter,sans-serif;white-space:nowrap;text-align:right}
.track{grid-column:2/4;height:8px;background:var(--card);border-radius:8px;overflow:hidden}
.track i{display:block;height:100%;border-radius:8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;height:150px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.pair2{flex:1;width:100%;display:flex;gap:3px;align-items:flex-end;justify-content:center}
.pair2 i{width:min(18px,40%);border-radius:4px 4px 0 0;min-height:2px}
.in{background:var(--in)}.out{background:var(--out)}
.col span{font-size:13px;color:var(--mute)}
.legend{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-left:8px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar input{flex:1 1 180px}
input,select{height:46px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 12px;font-size:16px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--in);outline-offset:1px}
.sum{color:var(--mute);font-size:14px;margin:12px 0 0}
.sum b{font-family:"Space Grotesk",Inter,sans-serif;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.day{font:600 13px Inter;color:var(--mute);margin:18px 0 4px}
.txs{list-style:none;margin:0;padding:0}
.tx{width:100%;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:0 12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer;min-height:56px}
.tx .dot{grid-row:1/3}
.t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.t2{grid-column:2/4;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font:600 15px "Space Grotesk",Inter,sans-serif;white-space:nowrap}
.prev{max-height:38vh;overflow:auto;margin-bottom:8px}
.prev .dup{opacity:.4}
.btn{height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--ink)}
.card .btn.ghost{background:var(--bg)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.danger{background:none;color:var(--neg);margin-right:auto;padding:0 6px}
.btn:disabled{opacity:.4}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:0 0 10px}
.card .top{display:flex;align-items:center;gap:10px}
.card .top b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bal{font:700 24px "Space Grotesk",Inter,sans-serif;white-space:nowrap;margin:4px 0 0}
.card .meta{font-size:14px;color:var(--mute)}
.card .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--bg);white-space:nowrap}
.chip.ok{color:var(--pos)}.chip.bad{color:var(--neg)}.chip.warn{color:var(--warn)}
.sec{margin:26px 0 0}
.sec .hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec .hdr h2{margin:0}
.bud{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;cursor:pointer;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.bud .track{height:10px}
.bud small{grid-column:2/4;font-size:13px;color:var(--mute)}
.fab{position:fixed;right:max(4vw,16px);bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--mint);color:#0b0b0b;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;display:grid;place-items:center;z-index:6}
.fab svg{width:26px;height:26px;stroke:#0b0b0b;stroke-width:2.4;fill:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav button{border:0;background:none;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--mute);cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
nav button[aria-current=page]{color:var(--ink);font-weight:600}
#sheet,#ask{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
#sheet[hidden],#ask[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.sh h2{margin:0 0 14px;font-size:22px}
@media(min-width:700px){#sheet,#ask{align-items:center}.sh{border-radius:22px}}
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-size:14px;font-weight:500;margin:0 0 5px}
.fld[hidden]{display:none}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--card);border-radius:12px;padding:4px;margin:0 0 14px}
.seg.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:grid;place-items:center;height:40px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer}
.seg input:checked+span{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.seg input:focus-visible+span{outline:3px solid var(--in)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw label{position:relative}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{display:block;width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.sw input:checked+span{border-color:var(--ink)}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;margin:0 0 12px}
.chk input{width:22px;height:22px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--mute);margin:0 0 12px}
.hint.bad{color:var(--neg)}
textarea{width:100%;height:40vh;font:13px ui-monospace,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--ink)}
#lock{position:fixed;inset:0;z-index:50;background:#0b0b0b;color:#f4f4f4;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#lock[hidden]{display:none}
.lk{width:100%;max-width:340px;display:grid;gap:12px;justify-items:center}
.lk img{border-radius:20px}.lk h2{margin:6px 0 0;font-size:26px}
.lk .btn{width:100%}.btn.gold{background:linear-gradient(135deg,#ffe278,#e8aa28 55%,#a05f0a);color:#0b0b0b}
.btn.lkghost{background:#1d1d1d;color:#f4f4f4}
#lkform{display:grid;gap:10px;width:100%}#lkform[hidden]{display:none}#lkform input{background:#151515;color:#fff;border-color:#333}
#lockmsg{min-height:20px;font-size:14px;color:#ffb3ad;margin:0}
body.cover>*:not(#lock){filter:blur(24px)}
.fc{background:var(--card);border-radius:20px;padding:18px 18px 14px;margin:0 0 18px}
.fc .fbig{font:700 clamp(26px,8vw,32px) "Space Grotesk",Inter,sans-serif;margin:2px 0 6px;white-space:nowrap}
.fc p{margin:4px 0}.fc ul{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.fc li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.fc li span:nth-child(2){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fc li b{font-family:"Space Grotesk",Inter,sans-serif;white-space:nowrap}
.linkbtn{background:none;border:0;padding:8px 0 0;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
ol.steps{padding-left:20px;margin:0 0 12px}ol.steps li{margin:0 0 10px}
code.u{display:block;background:var(--card);border-radius:10px;padding:10px;font-size:13px;overflow-wrap:anywhere}
.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 0 16px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}
.qc{flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center}
.qc i{font-style:normal;color:var(--mute);font-weight:500}.qc.add{border-style:dashed;color:var(--mute)}
.filt{background:var(--card);border-radius:14px;padding:12px 12px 4px;margin:10px 0 0}.filt .seg{background:var(--bg);margin-bottom:10px}
.plan{list-style:none;margin:0;padding:0}.plan>li>button{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer;text-align:left;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.plan .mo{font-weight:600;text-transform:capitalize}.plan .fr{font-size:14px;font-weight:600;white-space:nowrap}.plan .tr2{grid-column:2/4;height:8px;border-radius:8px;background:var(--card);overflow:hidden;display:flex}
.plan .tr2 i{display:block;height:100%}.plan .sub{grid-column:2/4;font-size:13px;color:var(--mute)}
.plan .det{list-style:none;margin:0;padding:6px 0 10px 68px;font-size:14px}.plan .det li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.plan .det li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plan .det b{font-family:"Space Grotesk",Inter,sans-serif;white-space:nowrap}
.parc li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}.parc small{grid-column:1/3;color:var(--mute);font-size:13px}
.parc b{font-family:"Space Grotesk",Inter,sans-serif;white-space:nowrap}
#toast .undo{background:none;border:0;color:var(--mint);font-weight:700;margin-left:8px;cursor:pointer;font-size:14px;padding:6px 2px}
:root.gold{color-scheme:dark;--bg:#0a0a0a;--ink:#f4efe4;--mute:#a39a8b;--line:#2a2620;--card:#15130f;--hero:linear-gradient(135deg,#ffe07a,#e8aa28 55%,#a8650c);--heroink:#0b0b0b;--mint:#e8aa28;--neg:#ff7d73;--pos:#e9c46a;--warn:#ffbe5c;--in:#e8b64c;--out:#f4efe4}
:root.gold .btn:not(.ghost):not(.danger):not(.lkghost){background:linear-gradient(135deg,#ffe07a,#e8aa28);color:#0b0b0b}
:root.gold nav button[aria-current=page]{color:#e8aa28}:root.gold .hero .big.neg{color:#7a1410}
.goal{background:var(--card);border-radius:16px;padding:14px 16px;margin:0 0 10px}.goal .top{display:flex;gap:10px;align-items:center}.goal .top b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .gv{font:700 22px "Space Grotesk",Inter,sans-serif;margin:6px 0 2px;white-space:nowrap}.goal .track{height:10px;background:var(--bg);margin:8px 0}
.rep .kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 16px}.rep .kpi div{background:var(--card);border-radius:12px;padding:10px 8px}
.rep .kpi b{display:block;font:700 clamp(12px,3.6vw,16px) "Space Grotesk",Inter,sans-serif;white-space:nowrap}
.rep .cols{grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;height:140px}.rep .col span{font-size:11px}
.rep table{width:100%;border-collapse:collapse;font-size:14px}.rep th,.rep td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.rep th:first-child,.rep td:first-child{text-align:left;white-space:normal}
.rep th{font-size:12px;color:var(--mute);font-weight:600}.rep h3{font-size:16px;margin:20px 0 6px}
.yr{display:flex;align-items:center;gap:6px;margin:0 0 12px}.yr b{font:700 22px "Space Grotesk",Inter,sans-serif;flex:1;text-align:center}
.cf{background:var(--card);border-radius:16px;padding:14px 16px;margin:0 0 18px}.cf .act{margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips span{font-size:13px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--card);white-space:nowrap}
.st-ok{color:var(--pos)}.st-bad{color:var(--neg)}.st-warn{color:var(--warn)}.st-mute{color:var(--mute)}
.rcl{list-style:none;margin:0;padding:0}.rcl li{padding:10px 0;border-bottom:1px solid var(--line)}.rcl .r1{display:flex;gap:8px;justify-content:space-between}.rcl .r1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcl .r1 b{font-family:"Space Grotesk",Inter,sans-serif;white-space:nowrap}.rcl small{display:block;color:var(--mute);font-size:13px}.rcl .act{margin-top:6px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:14px;padding:14px 16px;margin:0 0 10px;cursor:pointer}.opt b{display:block;font-size:16px}.opt span{color:var(--mute);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media(max-width:380px){.mnav b{min-width:96px;font-size:14px}.pair b{font-size:14px}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>Finanças</h1>
    <div class="mnav">
      <button class="ib" data-act="prevM" aria-label="Mês anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <b id="mlabel"></b>
      <button class="ib" data-act="nextM" aria-label="Próximo mês"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
  <p id="mode">Carregando…</p>
  <p id="note" hidden></p>
</header>
<main id="main"><p class="empty">Carregando seus dados…</p></main>
<button class="fab" data-act="newTx" aria-label="Novo lançamento"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav aria-label="Seções"><div>
  <button data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-tab="lanc"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Lançamentos</button>
  <button data-tab="contas"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Contas</button>
  <button data-tab="fixas"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Fixas</button>
  <button data-tab="orc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg>Orçamento</button>
</div></nav>
<div id="sheet" hidden><div class="sh" role="dialog" aria-modal="true"></div></div>
<div id="ask" hidden><div class="sh" role="alertdialog" aria-modal="true"><p style="font-size:17px;margin:4px 0 0"></p><div class="row"><button class="btn ghost" data-no>Cancelar</button><button class="btn" data-ok>Confirmar</button></div></div></div>
<div id="lock" hidden><div class="lk"><img src="icon-ms-192.png" alt="" width="84" height="84"><h2>Finanças</h2><p class="hint" style="color:#b9b9b9">Bloqueado</p>
<button class="btn gold" id="lkface">Desbloquear com Face ID</button><button class="btn lkghost" id="lkpass">Usar a senha da nuvem</button>
<form id="lkform" hidden><input type="text" name="username" autocomplete="username" value="financas-app" hidden><input name="p" type="password" autocomplete="current-password" placeholder="Senha da nuvem" aria-label="Senha da nuvem"><button class="btn gold">Entrar</button></form>
<p id="lockmsg" role="status"></p></div></div>
<div id="toast" role="status"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<script src="config.js"></script>
<script>
{
const THEMES={auto:'Automático',light:'Claro',dark:'Escuro',gold:'Preto e dourado'};
function applyTheme(){let t='auto';try{t=localStorage.getItem('fin:theme')||'auto'}catch(e){}const r=document.documentElement;
  if(t==='light')r.dataset.theme='light';else if(t==='dark'||t==='gold')r.dataset.theme='dark';else delete r.dataset.theme;r.classList.toggle('gold',t==='gold');
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>m.content=t==='gold'?'#0a0a0a':t==='dark'?'#0c0d0d':t==='light'?'#ffffff':(m.media.includes('dark')?'#0c0d0d':'#ffffff'))}
applyTheme();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money=v=>brl.format(Math.abs(v)<.005?0:v||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ym=d=>d.slice(0,7);
const addMonths=(m,n)=>{let[y,mo]=m.split('-').map(Number);mo+=n;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return y+'-'+pad(mo)};
const dim=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const mkDate=(m,d)=>m+'-'+pad(Math.min(Math.max(1,d),dim(m)));
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESF=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SEM=['dom','seg','ter','qua','qui','sex','sáb'];
const mLabel=m=>MESF[+m.slice(5)-1]+' '+m.slice(0,4);
const fmtD=d=>d.slice(8)+'/'+d.slice(5,7);
const days=d=>Math.round((new Date(d+'T12:00')-new Date(today()+'T12:00'))/864e5);
const r2=v=>Math.round(v*100)/100;
const num=s=>{s=String(s??'').trim().replace(/[R$\s ]/g,'');if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const v=parseFloat(s);return isFinite(v)?v:NaN};
const norm2=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const norm=s=>norm2(s).replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' ');
const PAL=['#2f9e6b','#3b7dd8','#d9822b','#c2417a','#7a5af5','#1aa3a3','#b39a1f','#e5484d','#5b6b73','#8a5a3c','#4caf50','#9c6ade'];
const DEF_CATS=[['moradia','Moradia','d'],['mercado','Mercado','d'],['comer','Alimentação fora','d'],['transp','Transporte','d'],['saude','Saúde','d'],['educ','Educação','d'],['lazer','Lazer','d'],['assin','Assinaturas','d'],['compras','Compras','d'],['casa','Contas da casa','d'],['outros','Outros','d'],['salario','Salário','r'],['extra','Renda extra','r'],['rend','Rendimentos','r'],['outrosr','Outras receitas','r']].map(([id,name,kind],i)=>({id,name,kind,color:PAL[i%PAL.length]}));
const KW=[[/ifood|restaur|lanch|padaria|bar |pizz|burger|cafe/,'comer'],[/uber|99 ?pop|99app|posto|combust|shell|ipiranga|estacion|pedagio|metro|onibus/,'transp'],[/mercado|supermerc|atacad|carrefour|assai|extra hiper|pao de acucar|hortifrut/,'mercado'],[/farmac|drogaria|droga|raia|hospital|clinica|laborat|unimed/,'saude'],[/netflix|spotify|prime video|amazon prime|disney|youtube|hbo|max |apple\.com|icloud|google one|deezer|globoplay/,'assin'],[/aluguel|condominio|iptu/,'moradia'],[/energia|enel|cemig|copel|light|sabesp|agua|gas |internet|vivo|claro|tim |oi /,'casa'],[/escola|faculdade|curso|udemy|livraria/,'educ'],[/cinema|ingresso|show|steam|playstation|xbox/,'lazer'],[/salario|salário|folha|pagto sal/,'salario'],[/rendimento|juros|dividend|rend pago/,'rend']];

const S={f:{all:false,cat:'',acc:'',min:'',max:'',open:false},cfg:null,dels:{},rc:{},months:{},month:ym(today()),tab:'inicio',q:'',mode:'',loaded:false,note:''};
let store=null;const saving={},dirty={};

const cfg=()=>S.cfg||{accounts:[],cats:DEF_CATS,budgets:{},recur:[],rules:{}};
function ensureCfg(){if(!S.cfg)S.cfg=JSON.parse(JSON.stringify(cfg()));const c=S.cfg;c.accounts=c.accounts||[];c.cats=c.cats||JSON.parse(JSON.stringify(DEF_CATS));c.budgets=c.budgets||{};c.recur=c.recur||[];c.rules=c.rules||{};return c}
const catOf=id=>cfg().cats.find(c=>c.id===id)||{name:'Sem categoria',color:'#8a8f8c',kind:'d'};
const accOf=id=>cfg().accounts.find(a=>a.id===id);
const accName=id=>(accOf(id)||{name:'Conta removida'}).name;
const monthTx=m=>S.months[m]||[];
const allTx=()=>Object.values(S.months).flat();

async function save(k){
  if(!store)return;
  if(saving[k]){dirty[k]=1;return}
  saving[k]=1;
  try{do{dirty[k]=0;
    if(k==='config')await store.set(k,JSON.parse(JSON.stringify(S.cfg)));
    else{const m=k.slice(2),tx=S.months[m]||[],dl=S.dels[m]||[],rc=S.rc[m]||[];if(tx.length||dl.length||rc.length)await store.set(k,{tx:JSON.parse(JSON.stringify(tx)),del:dl.slice(-1000),rc:JSON.parse(JSON.stringify(rc))});else{delete S.months[m];await store.del(k)}if(!tx.length)delete S.months[m]}
  }while(dirty[k]);markDirty(k)}
  catch(e){toast(e&&e.code==='quota_exceeded'?'Espaço cheio. Exporte um backup e apague meses antigos.':'Não consegui salvar ('+((e&&e.code)||'erro')+'). Tente de novo.')}
  saving[k]=0;
}
function putTx(t){t.m=Date.now();const k=ym(t.date);(S.months[k]=S.months[k]||[]).push(t);save('m-'+k)}
function findTx(id){for(const k in S.months){const t=S.months[k].find(x=>x.id===id);if(t)return t}return null}
function removeTx(id,noTomb){for(const k in S.months){const i=S.months[k].findIndex(x=>x.id===id);if(i>=0){S.months[k].splice(i,1);if(!noTomb)(S.dels[k]=S.dels[k]||[]).push(id);save('m-'+k);return}}}
function learn(desc,cat){const k=norm(desc);if(!k||!cat)return;const c=ensureCfg();if(c.rules[k]!==cat){c.rules[k]=cat;save('config')}}
function guessCat(desc,kind){const c=cfg();const r=c.rules[norm(desc)];const ok=id=>{const x=c.cats.find(cc=>cc.id===id);return x&&x.kind===kind};
  if(r&&ok(r))return r;const n=' '+norm2(desc)+' ';for(const[re,id]of KW)if(re.test(n)&&ok(id))return id;
  const first=c.cats.find(cc=>cc.kind===kind&&/^outr/i.test(norm2(cc.name)))||c.cats.find(cc=>cc.kind===kind);return first?first.id:''}

function totals(m){let r=0,d=0;for(const t of monthTx(m)){if(t.kind==='r')r+=t.amt;else if(t.kind==='d')d+=t.amt}return{r:r2(r),d:r2(d)}}
function spent(m){const o={};for(const t of monthTx(m))if(t.kind==='d')o[t.cat]=(o[t.cat]||0)+t.amt;return o}
function byCat(m){const o=spent(m);return Object.entries(o).map(([id,v])=>({c:catOf(id),v:r2(v)})).sort((a,b)=>b.v-a.v)}
function balance(a){let b=+a.initial||0;for(const t of allTx()){if(t.acc===a.id)b+=t.kind==='r'?t.amt:-t.amt;if(t.kind==='t'&&t.to===a.id)b+=t.amt}return r2(b)}
const fatMonth=(t,card)=>+t.date.slice(8)>(+card.closeDay||31)?addMonths(ym(t.date),1):ym(t.date);
function fatura(card,M){let v=0;for(const t of allTx())if(t.acc===card.id&&t.kind!=='t'&&fatMonth(t,card)===M)v+=t.kind==='d'?t.amt:-t.amt;return r2(v)}
const fatDue=(card,M)=>(+card.dueDay||10)>(+card.closeDay||31)?mkDate(M,+card.dueDay||10):mkDate(addMonths(M,1),+card.dueDay||10);
const fatPaid=(card,M)=>allTx().some(t=>t.fat===card.id+'|'+M);
const recPaid=(r,M)=>!!r.payroll||monthTx(M).some(t=>t.rid===r.id);
const recActive=(r,M)=>(!r.start||M>=r.start)&&(!r.end||M<=r.end);
const mv=v=>{v=Math.abs(+v||0);return v?'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):''};
function avgRec(r){const ps=allTx().filter(t=>t.rid===r.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);return ps.length?r2(ps.reduce((s,t)=>s+t.amt,0)/ps.length):+r.amount||0}
const MI='class="money" inputmode="numeric" autocomplete="off"';

function toast(msg,undo){const t=$('#toast');t.textContent=msg;t.style.pointerEvents=undo?'auto':'none';if(undo){const b=document.createElement('button');b.className='undo';b.textContent='Desfazer';b.onclick=()=>{t.classList.remove('on');undo()};t.append(' ',b)}t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),undo?5000:2600)}
function sheet(html){const s=$('#sheet');s.querySelector('.sh').innerHTML=html;s.hidden=false;const f=s.querySelector('input:not([type=radio]):not([type=hidden]),select');if(f&&matchMedia('(min-width:700px)').matches)f.focus()}
function closeSheet(){$('#sheet').hidden=true;$('#sheet .sh').innerHTML=''}
function ask(msg,ok){return new Promise(res=>{const d=$('#ask');d.querySelector('p').textContent=msg;const y=d.querySelector('[data-ok]');y.textContent=ok||'Confirmar';d.hidden=false;const done=v=>{d.hidden=true;res(v)};y.onclick=()=>done(true);d.querySelector('[data-no]').onclick=()=>done(false)})}
const accOpts=(sel,filter)=>cfg().accounts.filter(filter||(()=>1)).map(a=>`<option value="${esc(a.id)}" ${a.id===sel?'selected':''}>${esc(a.name)}${a.type==='cartao'?' (cartão)':''}</option>`).join('');
const dayLabel=d=>{const dt=new Date(d+'T12:00');const n=days(d);return(n===0?'Hoje':n===-1?'Ontem':SEM[dt.getDay()])+', '+fmtD(d)};
const curM=()=>ym(today());

function alerts(m){const c=cfg(),out=[],sp=spent(m);
  for(const cat of c.cats){const b=+c.budgets[cat.id]||0;if(!b)continue;const s=sp[cat.id]||0;
    if(s>b)out.push(`<li class="bad"><span>${esc(cat.name)} passou do orçamento: ${money(s)} de ${money(b)}</span></li>`);
    else if(s>=.8*b)out.push(`<li><span>${esc(cat.name)} já usou ${Math.round(s/b*100)}% do orçamento</span></li>`)}
  if(m===curM()){for(const r of c.recur){if(r.payroll||!recActive(r,m)||recPaid(r,m)||r.auto)continue;const n=days(mkDate(m,+r.day));
    if(n<0)out.push(`<li class="bad"><span>${esc(r.name)} venceu há ${-n} dia${n===-1?'':'s'} · ${money(r.amount)}</span><button class="btn sm" data-act="payRec" data-id="${esc(r.id)}">Pagar</button></li>`);
    else if(n<=5)out.push(`<li><span>${esc(r.name)} ${n===0?'vence hoje':'vence em '+n+' dia'+(n===1?'':'s')} · ${money(r.amount)}</span><button class="btn sm" data-act="payRec" data-id="${esc(r.id)}">Pagar</button></li>`)}
    for(const a of c.accounts.filter(a=>a.type==='cartao'))for(const M of[addMonths(m,-1),m]){const due=fatDue(a,M),n=days(due),v=fatura(a,M);
      if(v>0&&!fatPaid(a,M)&&n<=7&&n>=-20)out.push(`<li class="${n<0?'bad':''}"><span>Fatura ${esc(a.name)} ${n<0?'venceu dia '+fmtD(due):n===0?'vence hoje':'vence dia '+fmtD(due)} · ${money(v)}</span><button class="btn sm" data-act="payFat" data-id="${esc(a.id+'|'+M)}">Pagar</button></li>`)}}
  return out}

function vHome(){const m=S.month,{r,d}=totals(m),left=r2(r-d),c=cfg();
  const tot=c.accounts.filter(a=>a.type!=='cartao').reduce((s,a)=>s+balance(a),0);
  const cats=byCat(m),max=Math.max(1,...cats.map(x=>x.v)),al=alerts(m);
  const hist=[0,1,2,3,4,5].map(i=>addMonths(m,i-5)).map(k=>({k,...totals(k)})),hm=Math.max(1,...hist.flatMap(h=>[h.r,h.d]));
  return `<section class="hero"><span class="lbl">${left<0?'Faltou':'Sobrou'} em ${MESF[+m.slice(5)-1].toLowerCase()}</span><p class="big num${left<0?' neg':''}">${money(left)}</p>
  <div class="pair"><div><span class="lbl">Receitas</span><b>${money(r)}</b></div><div><span class="lbl">Despesas</span><b>${money(d)}</b></div><div><span class="lbl">Saldo em contas</span><b>${money(tot)}</b></div></div></section>
  ${vQuick()}
  ${vConfCard()}
  ${m===curM()?vSuggest():''}
  ${m===curM()?vForecast():''}
  ${m===curM()?vPlan():''}
  ${!c.accounts.length?`<div class="callout"><span>Comece cadastrando uma conta ou cartão.</span><button class="btn" data-act="newAcc">Criar conta</button></div>`:''}
  ${al.length?`<section class="blk"><h2>Atenção</h2><ul class="alerts">${al.join('')}</ul></section>`:''}
  <section class="blk"><h2>Para onde foi o dinheiro</h2>${cats.length?`<ul class="bars">${cats.map(x=>`<li><span class="dot" style="background:${esc(x.c.color)}"></span><span class="nm">${esc(x.c.name)}</span><span class="v">${money(x.v)} <small style="color:var(--mute);font-weight:500">${d?Math.round(x.v/d*100):0}%</small></span><span class="track"><i style="width:${(x.v/max*100).toFixed(1)}%;background:${esc(x.c.color)}"></i></span></li>`).join('')}</ul>`:'<p class="empty">Nenhuma despesa neste mês ainda.</p>'}</section>
  <section class="blk"><h2>Últimos 6 meses</h2><div class="cols">${hist.map(h=>`<div class="col" title="${esc(mLabel(h.k))}: receitas ${money(h.r)}, despesas ${money(h.d)}"><div class="pair2"><i class="in" style="height:${(h.r/hm*100).toFixed(1)}%"></i><i class="out" style="height:${(h.d/hm*100).toFixed(1)}%"></i></div><span>${MES[+h.k.slice(5)-1]}</span></div>`).join('')}</div><p class="legend"><i class="in" style="margin:0"></i>Receitas<i class="out"></i>Despesas</p><button class="btn ghost" style="margin-top:14px;width:100%" data-act="report">Relatório do ano e exportar para Excel</button></section>`}

function txRow(t){const c=catOf(t.cat);const tr=t.kind==='t';
  const sub=tr?accName(t.acc)+' → '+accName(t.to):c.name+' · '+accName(t.acc);
  return `<li><button class="tx" data-act="editTx" data-id="${esc(t.id)}"><span class="dot" style="background:${tr?'var(--mute)':esc(c.color)}"></span><span class="t1">${esc(t.desc||(tr?'Transferência':c.name))}</span><span class="amt ${t.kind==='d'?'neg':t.kind==='r'?'pos':''}">${t.kind==='d'?'−':t.kind==='r'?'+':''}${money(t.amt)}</span><span class="t2">${esc(sub)}</span></button></li>`}
function vTx(){const m=S.month,q=norm2(S.q).trim(),F=S.f,c=cfg();
  let list=(F.all?allTx():monthTx(m)).slice();
  if(q)list=list.filter(t=>norm2(t.desc+' '+catOf(t.cat).name+' '+accName(t.acc)+(t.to?' '+accName(t.to):'')).includes(q));
  if(F.cat)list=list.filter(t=>t.cat===F.cat);
  if(F.acc)list=list.filter(t=>t.acc===F.acc||t.to===F.acc);
  const mn=num(F.min),mx=num(F.max);if(mn>0)list=list.filter(t=>t.amt>=mn);if(mx>0)list=list.filter(t=>t.amt<=mx);
  list.sort((a,b)=>b.date.localeCompare(a.date)||(b.m||0)-(a.m||0));
  const nf=(F.all?1:0)+(F.cat?1:0)+(F.acc?1:0)+(mn>0?1:0)+(mx>0?1:0),filtered=nf>0||!!q;
  const sr=r2(list.filter(t=>t.kind==='r').reduce((s,t)=>s+t.amt,0)),sd=r2(list.filter(t=>t.kind==='d').reduce((s,t)=>s+t.amt,0));
  const shown=list.slice(0,300),g={};shown.forEach(t=>(g[t.date]=g[t.date]||[]).push(t));
  const{r,d}=totals(m);
  return `<div class="toolbar"><input id="q" type="search" placeholder="${F.all?'Buscar em todos os meses':'Buscar neste mês'}" value="${esc(S.q)}" aria-label="Buscar lançamentos"><button class="btn ghost" data-act="fOpen" aria-expanded="${F.open?'true':'false'}">Filtros${nf?' ('+nf+')':''}</button><button class="btn ghost" data-act="importMenu">Importar</button></div>
  ${F.open?`<div class="filt"><div class="seg s2"><label><input type="radio" name="fAll" value="0" ${F.all?'':'checked'}><span>Este mês</span></label><label><input type="radio" name="fAll" value="1" ${F.all?'checked':''}><span>Todos os meses</span></label></div>
  <div class="two"><label class="fld"><span>Categoria</span><select id="fCat"><option value="">Todas</option>${c.cats.map(x=>`<option value="${esc(x.id)}" ${x.id===F.cat?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
  <label class="fld"><span>Conta</span><select id="fAcc"><option value="">Todas</option>${accOpts(F.acc)}</select></label></div>
  <div class="two"><label class="fld"><span>Valor a partir de</span><input id="fMin" ${MI} placeholder="R$ 0,00" value="${esc(F.min)}"></label><label class="fld"><span>Valor até</span><input id="fMax" ${MI} placeholder="sem limite" value="${esc(F.max)}"></label></div>
  ${nf?'<button class="linkbtn" data-act="fClear" style="padding:0 0 4px">Limpar filtros</button>':''}</div>`:''}
  ${filtered?`<p class="sum"><b>${list.length}</b> resultado${list.length===1?'':'s'}${F.all?' em todos os meses':''} · Despesas <b class="neg">${money(sd)}</b> · Receitas <b class="pos">${money(sr)}</b></p>`
  :`<p class="sum">Receitas <b class="pos">${money(r)}</b> · Despesas <b class="neg">${money(d)}</b> · ${monthTx(m).length} lançamentos</p>`}
  ${list.length>300?'<p class="hint">Mostrando os 300 mais recentes. Refine a busca para ver o resto.</p>':''}
  ${list.length?Object.keys(g).map(k=>`<h3 class="day">${F.all&&ym(k)!==curM()?dayLabel(k)+'/'+k.slice(0,4):dayLabel(k)}</h3><ul class="txs">${g[k].map(txRow).join('')}</ul>`).join(''):`<p class="empty">${q?'Nada encontrado.':'Nenhum lançamento em '+esc(mLabel(m))+'. Toque em + para lançar ou importe um extrato OFX/CSV.'}</p>`}`}

function vAcc(){const c=cfg();
  const contas=c.accounts.filter(a=>a.type!=='cartao'),cards=c.accounts.filter(a=>a.type==='cartao');
  const accCard=a=>`<div class="card"><div class="top"><b>${esc(a.name)}</b><button class="btn ghost sm" data-act="editAcc" data-id="${esc(a.id)}">Editar</button></div><p class="bal ${balance(a)<0?'neg':''}">${money(balance(a))}</p><p class="meta">Saldo atual</p></div>`;
  const cardCard=a=>{const M=S.month===curM()?fatMonth({date:today()},a):S.month,v=fatura(a,M),due=fatDue(a,M),paid=fatPaid(a,M),n=days(due);
    return `<div class="card"><div class="top"><b>${esc(a.name)}</b><button class="btn ghost sm" data-act="editAcc" data-id="${esc(a.id)}">Editar</button></div><p class="bal">${money(v)}</p><p class="meta">Fatura de ${MESF[+M.slice(5)-1].toLowerCase()} · fecha dia ${esc(a.closeDay)} · vence ${fmtD(due)}</p>
    <div class="act">${paid?'<span class="chip ok">Paga</span>':v>0?`<span class="chip ${n<0?'bad':n<=7?'warn':''}">${n<0?'Vencida':n===0?'Vence hoje':'Em aberto'}</span><button class="btn sm" data-act="payFat" data-id="${esc(a.id+'|'+M)}">Pagar fatura</button>`:'<span class="chip">Sem gastos</span>'}</div></div>`};
  return `<div class="sec" style="margin-top:0"><div class="hdr"><h2>Contas</h2><button class="btn ghost sm" data-act="newAcc">Nova conta</button></div>${contas.length?contas.map(accCard).join(''):'<p class="empty">Nenhuma conta ainda. Cadastre sua conta corrente, poupança ou carteira.</p>'}</div>
  <div class="sec"><div class="hdr"><h2>Cartões</h2><button class="btn ghost sm" data-act="newCard">Novo cartão</button></div>${cards.length?cards.map(cardCard).join(''):'<p class="empty">Nenhum cartão cadastrado.</p>'}</div>
  ${vCloud()}
  ${vSecurity()}
  <div class="sec"><div class="hdr"><h2>Backup manual</h2></div><p class="hint">Guarde uma cópia dos seus dados de vez em quando. O arquivo também serve para levar tudo para outro lugar.</p><div class="toolbar"><button class="btn ghost" data-act="exportBk">Exportar backup</button><button class="btn ghost" data-act="restoreBk">Restaurar backup</button></div></div>`}

function vRec(){const c=cfg(),M=S.month,all=c.recur.slice().sort((a,b)=>a.day-b.day),list=all.filter(r=>recActive(r,M)),off=all.filter(r=>!recActive(r,M));
  const tot=list.filter(r=>r.kind!=='r'&&!r.payroll).reduce((s,r)=>s+(+(r.vary?avgRec(r):r.amount)||0),0),totP=list.filter(r=>r.payroll).reduce((s,r)=>s+(+r.amount||0),0);
  const prazo=r=>r.end?(()=>{const n=monthsBetween(M,r.end);return n<0?'encerrada':n===0?'último mês':`termina ${MES[+r.end.slice(5)-1]}/${r.end.slice(2,4)} · faltam ${n+1}`})():'';
  return `<div class="sec" style="margin-top:0"><div class="hdr"><h2>Contas fixas de ${MESF[+M.slice(5)-1].toLowerCase()}</h2><button class="btn ghost sm" data-act="newRec">Nova</button></div>
  ${list.length?`<p class="sum" style="margin:0 0 12px">Total fixo de despesas: <b>${money(tot)}</b> por mês${totP?` · descontado no holerite: <b>${money(totP)}</b>`:''}</p>`+list.map(r=>{const paid=recPaid(r,M),due=mkDate(M,+r.day),n=days(due);
    const lt=paid&&monthTx(M).find(t=>t.rid===r.id),st=r.payroll?'<span class="chip">Descontado no holerite</span>':paid?`<span class="chip ok">${lt&&lt.auto?'Lançada':'Paga'}${lt&&Math.abs(lt.amt-(+r.amount))>.01?' · '+money(lt.amt):''}</span>`:r.kind==='r'?(n<0?'<span class="chip warn">Ainda não caiu</span>':`<span class="chip">${n===0?'Cai hoje':'Cai em '+n+'d'}</span>`):n<0?'<span class="chip bad">Vencida</span>':n<=5?`<span class="chip warn">${n===0?'Vence hoje':'Vence em '+n+'d'}</span>`:'<span class="chip">A vencer</span>';
    return `<div class="card"><div class="top"><span class="dot" style="background:${esc(catOf(r.cat).color)}"></span><b>${esc(r.name)}</b><button class="btn ghost sm" data-act="editRec" data-id="${esc(r.id)}">Editar</button></div><p class="bal ${r.kind==='r'?'pos':''}">${money(+r.amount)}</p><p class="meta">Todo dia ${esc(r.day)} · ${esc(catOf(r.cat).name)} · ${esc(accName(r.acc))}${r.vary?' · valor variável':''}${prazo(r)?' · '+prazo(r):''}</p><div class="act">${st}${r.auto&&!r.payroll?'<span class="chip">Automática</span>':''}${paid?'':`<button class="btn sm" data-act="payRec" data-id="${esc(r.id)}">${r.kind==='r'?'Recebi':'Pagar'}</button>`}</div></div>`}).join(''):all.length?'<p class="empty">Nenhuma conta fixa neste mês.</p>':'<p class="empty">Cadastre aluguel, assinaturas, escola, financiamento, salário… Com prazo, o app cuida de todos os meses: avisa, lança sozinho se você quiser e marca como paga quando importar o extrato.</p>'}
  ${off.length?`<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Fora deste mês (${off.length})</summary>${off.map(r=>`<div class="card" style="margin-top:8px"><div class="top"><b>${esc(r.name)}</b><button class="btn ghost sm" data-act="editRec" data-id="${esc(r.id)}">Editar</button></div><p class="meta">${r.start&&M<r.start?'Começa em '+MES[+r.start.slice(5)-1]+'/'+r.start.slice(2,4):'Terminou em '+MES[+r.end.slice(5)-1]+'/'+r.end.slice(2,4)} · ${money(+r.amount)}</p></div>`).join('')}</details>`:''}</div>`}

function vBud(){const c=cfg(),M=S.month,sp=spent(M);const ds=c.cats.filter(x=>x.kind==='d'),rs=c.cats.filter(x=>x.kind==='r');
  const tb=ds.reduce((s,x)=>s+(+c.budgets[x.id]||0),0),ts=ds.filter(x=>+c.budgets[x.id]).reduce((s,x)=>s+(sp[x.id]||0),0);
  const row=x=>{const b=+c.budgets[x.id]||0,s=r2(sp[x.id]||0),p=b?s/b:0,col=p>1?'var(--neg)':p>=.8?'var(--warn)':esc(x.color);

  return `${vGoals()}<div class="sec"><div class="hdr"><h2>Orçamento de ${MESF[+M.slice(5)-1].toLowerCase()}</h2><button class="btn ghost sm" data-act="newCat">Nova categoria</button></div>

  ${ds.map(row).join('')}</div>

function openTx(t,pre,note){const c=cfg();if(!c.accounts.length){toast('Cadastre uma conta primeiro.');openAcc(null,'conta');return}
  const isNew=!t,x=t?{...t}:{id:uid(),kind:'d',amt:'',desc:'',date:S.month===curM()?today():S.month+'-01',cat:'',acc:c.accounts[0].id,to:'',...pre};
  if(!x.to)x.to=(c.accounts.find(a=>a.id!==x.acc)||{}).id||'';

  ${isNew&&!pre?`<label class="fld"><span>Escreva do seu jeito</span><input name="smart" autocomplete="off" enterkeyhint="done" placeholder="Ex.: mercado 85,90 ontem no nubank"></label><p class="hint" id="smh" style="margin-top:-6px">Ou preencha os campos abaixo.</p>`:''}
  <div class="seg">${[['d','Despesa'],['r','Receita'],['t','Transferência']].map(([k,l])=>`<label><input type="radio" name="kind" value="${k}" ${x.kind===k?'checked':''}><span>${l}</span></label>`).join('')}</div>

  <label class="fld"><span>Data</span><input name="date" type="date" value="${esc(x.date)}"></label></div>
  <label class="fld"><span>Descrição</span><input name="desc" value="${esc(x.desc)}" maxlength="80" autocomplete="off" placeholder="Ex.: Mercado do mês"></label>

  <label class="fld" data-k="to"><span>Para a conta</span><select name="to">${accOpts(x.to)}</select></label>

  ${x.inst?`<p class="hint">Parcela ${esc(x.inst)}. Alterar aqui muda só esta parcela.</p>`:''}
  <div class="row">${isNew?'':'<button type="button" class="btn danger" id="del">Excluir</button>'}<button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn">Salvar</button></div></form>`);
  const f=$('#f'),q=k=>f.querySelector(`[data-k="${k}"]`);

    const cur=f.cat.value||x.cat,want=k==='r'?'r':'d',opts=c.cats.filter(cc=>cc.kind===want);
    f.cat.innerHTML=opts.map(cc=>`<option value="${esc(cc.id)}" ${cc.id===cur?'selected':''}>${esc(cc.name)}</option>`).join('');
    if(!opts.some(o=>o.id===cur))f.cat.value=guessCat(f.desc.value,want)||(opts[0]||{}).id||'';
    const p=q('parc');if(p){const a=accOf(f.acc.value);p.hidden=!(k==='d'&&a&&a.type==='cartao')}

      f.querySelector(`input[name=kind][value="${p.kind}"]`).checked=true;if(p.acc)f.acc.value=p.acc;sync();

      const pp=q('parc');if(p.parc&&pp){if(pp.hidden){const card=cfg().accounts.find(a=>a.type==='cartao');if(card&&!p.acc){f.acc.value=card.id;sync()}}f.parc.value=p.parc}
      const dl=f.date.value===today()?'hoje':f.date.value===addDays(today(),-1)?'ontem':fmtD(f.date.value);
      $('#smh').innerHTML='Entendi: <b>'+esc([p.kind==='r'?'Receita':'Despesa',p.amt?money(p.amt):'sem valor',f.desc.value||'',dl,accName(f.acc.value),(f.cat.selectedOptions[0]||{}).text||'',p.parc>1?p.parc+'x':''].filter(Boolean).join(' · '))+'</b>'};
    f.smart.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(apply,200)});

    setTimeout(()=>{try{f.smart.focus()}catch(_){}},80)}
  f.onsubmit=e=>{e.preventDefault();const amt=num(f.amt.value);if(!(amt>0)){toast('Informe um valor maior que zero.');f.amt.focus();return}

    if(n>1){const each=Math.floor(nt.amt/n*100)/100,first=r2(nt.amt-each*(n-1)),day=+nt.date.slice(8),base=nt.desc||catOf(nt.cat).name,grp=uid();
      for(let i=0;i<n;i++)putTx({...nt,grp,id:uid(),amt:i?each:first,date:mkDate(addMonths(ym(nt.date),i),day),desc:`${base} (${i+1}/${n})`,inst:`${i+1}/${n}`})}

  <div class="seg s2"><label><input type="radio" name="auto" value="0" ${x.auto?'':'checked'}><span>Eu confirmo</span></label><label><input type="radio" name="auto" value="1" ${x.auto?'checked':''}><span>Lançar sozinho</span></label></div>

    const n=en?monthsBetween(st,en)+1:0;$('#rsum').textContent=en?(n<1?'O último mês é antes do início.':`${n} ${n===1?'mês':'meses'} · de ${MES[+st.slice(5)-1]}/${st.slice(2,4)} a ${MES[+en.slice(5)-1]}/${en.slice(2,4)}${a?' · total '+money(r2(a*n)):''}`):`Todo mês a partir de ${MES[+st.slice(5)-1]}/${st.slice(2,4)}, sem data para acabar.`};

async function readText(file){const buf=await file.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);if(t.includes(String.fromCharCode(65533)))t=new TextDecoder('windows-1252').decode(buf);return t}
const pDate=s=>{s=String(s||'').trim();let m=s.match(/^(\d{4})-?(\d{2})-?(\d{2})/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m)return`${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return null};
function parseOFX(t){const out=[],parts=t.split(/<STMTTRN>/i).slice(1);
  for(const p of parts){const b=p.split(/<\/STMTTRN>/i)[0],g=k=>{const x=b.match(new RegExp('<'+k+'>([^<\\r\\n]*)','i'));return x?x[1].trim():''};
    const date=pDate(g('DTPOSTED')),amt=num(g('TRNAMT')),desc=(g('MEMO')||g('NAME')).replace(/\s+/g,' ');if(date&&isFinite(amt)&&amt)out.push({date,amt,desc,fitid:g('FITID')})}
  return out}
function parseCSV(t){const lines=t.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
  const split=l=>{const r=[];let cur='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===sep&&!q){r.push(cur);cur=''}else cur+=ch}r.push(cur);return r.map(v=>v.trim())};
  const hi=lines.findIndex(l=>/data|date/i.test(l)&&/valor|amount|value/i.test(l));let col={d:0,s:1,v:2},start=0;
  if(hi>=0){const h=split(lines[hi]).map(norm2);col={d:h.findIndex(v=>/data|date/.test(v)),s:h.findIndex(v=>/descri|hist|memo|lanc|estabelec|title|titulo|identific/.test(v)),v:h.findIndex(v=>/valor|amount|value/.test(v))};
    if(col.s<0)col.s=h.findIndex((v,i)=>i!==col.d&&i!==col.v);start=hi+1}
  return lines.slice(start).map(split).map(r=>({date:pDate(r[col.d]),amt:num(r[col.v]),desc:(r[col.s]||'').replace(/\s+/g,' ')})).filter(x=>x.date&&isFinite(x.amt)&&x.amt!==0)}

}

// ================= NUVEM CIFRADA (ponta a ponta) =================
// A senha nunca sai do aparelho. Dela derivamos (PBKDF2 600 mil rodadas + HKDF):
//  - enc: chave AES-256-GCM que cifra cada documento e cada aviso;
//  - mac: chave HMAC que gera nomes opacos para os documentos;
//  - auth: senha de acesso ao servidor (o servidor guarda só o SHA-256 dela).
const ITER=600000,te=new TextEncoder(),td=new TextDecoder();
const b64u=b=>{b=b instanceof ArrayBuffer?new Uint8Array(b):b;let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const x=atob(s),o=new Uint8Array(x.length);for(let i=0;i<x.length;i++)o[i]=x.charCodeAt(i);return o};
const API=()=>{let a='';try{a=window.FIN_API||localStorage.getItem('fin:api')||''}catch(e){}return String(a).replace(/\/+$/,'')};

async function idbOp(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('keys',mode),rq=fn(tx.objectStore('keys'));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)})}
async function deriveKeys(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pass.normalize('NFC')),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unb64u(salt),iterations:iter},base,256);
  const hk=await crypto.subtle.importKey('raw',bits,'HKDF',false,['deriveBits']);
  const sub=info=>crypto.subtle.deriveBits({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(32),info:te.encode(info)},hk,256);
  return{enc:await crypto.subtle.importKey('raw',await sub('financas/enc'),{name:'AES-GCM'},false,['encrypt','decrypt']),
    mac:await crypto.subtle.importKey('raw',await sub('financas/id'),{name:'HMAC',hash:'SHA-256'},false,['sign']),
    auth:b64u(new Uint8Array(await sub('financas/auth')))}}
async function seal(obj,aad){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:te.encode(aad)},K.enc,te.encode(JSON.stringify(obj)));return{iv:b64u(iv),c:b64u(new Uint8Array(c))}}
async function unseal(d,aad){const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64u(d.iv),additionalData:te.encode(aad)},K.enc,unb64u(d.c));return JSON.parse(td.decode(p))}

async function docId(n){if(!idCache[n])idCache[n]=b64u(new Uint8Array(await crypto.subtle.sign('HMAC',K.mac,te.encode('doc:'+n)))).slice(0,32);return idCache[n]}

function writeLocal(n,o){

    else{if(tx.length)S.months[m]=tx;else delete S.months[m];S.dels[m]=dl;if(rc.length)S.rc[m]=rc;else delete S.rc[m];localStorage.setItem('fin:'+n,JSON.stringify({tx,del:dl,rc}))}}}

const NAME_RE=/^(config|m-\d{4}-\d{2})$/;
async function sync(manual){
  if(!K||!SY.on||!API())return;if(syncing){again=true;return}

  try{
    const dirtyL=Object.entries(SY.docs).filter(([,m])=>m.dirty).map(([n,m])=>[n,m.u]);
    if(dirtyL.length){const docs=[];
      for(const[n,u]of dirtyL){const x=bodyOf(n);const id=await docId(n);docs.push({id,u,base:SY.srv[id]??null,...await seal({n,b:x.b||null,del:!!x.del},'doc')})}
      const r=await api('POST','/api/docs',{docs});
      for(const[n,u]of dirtyL){const id=await docId(n),s=r.docs[id];if(s&&s.u===u&&SY.docs[n]&&SY.docs[n].u===u){SY.docs[n].dirty=0;SY.srv[id]=u}}}
    const{docs:remote}=await api('GET','/api/docs');
    for(const id in remote){const d=remote[id];if(SY.srv[id]===d.u)continue;
      let o;try{o=await unseal(d,'doc')}catch(e){continue}
      if(!o||!NAME_RE.test(o.n))continue;const loc=SY.docs[o.n];
      if(loc&&loc.dirty){SY.srv[id]=d.u;
        if(o.n!=='config'&&!o.del){const m=o.n.slice(2);writeLocal(o.n,{b:mergeMonth({tx:S.months[m]||[],del:S.dels[m]||[],rc:S.rc[m]||[]},o.b)});SY.docs[o.n]={u:Math.max(Date.now(),d.u+1),dirty:1};again=true;changed=true;continue}
        if(loc.u>d.u)continue}

  }catch(e){SY.err=errMsg(e);if(manual)toast(SY.err)}

  if(changed&&autoPost())schedSync(500);

}

const addDays=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
const WHEN=n=>n===0?'vence hoje':n===1?'vence amanhã':n>1?'vence em '+n+' dias':'venceu ontem';
function buildReminders(){const c=cfg(),t0=today(),M=curM(),by={};
  const add=(on,pri,text)=>{if(on<t0)return;(by[on]=by[on]||[]).push({pri,text})};
  for(const r of c.recur)if(r.kind!=='r'&&!r.payroll)for(const m of[M,addMonths(M,1),addMonths(M,2)]){if(!recActive(r,m)||recPaid(r,m))continue;const due=mkDate(m,+r.day),v=r.vary?avgRec(r):+r.amount;
    if(r.auto){add(addDays(due,-1),1,`${r.name} será lançada amanhã · ${r.vary?'cerca de ':''}${money(v)}`);continue}
    for(const off of[3,1,0,-1])add(addDays(due,-off),off<=0?0:1,`${r.name} ${WHEN(off)} · ${r.vary?'cerca de ':''}${money(v)}`)}
  for(const a of c.accounts.filter(a=>a.type==='cartao'))for(const fm of[addMonths(M,-1),M,addMonths(M,1),addMonths(M,2)]){if(fatPaid(a,fm))continue;const v=fatura(a,fm);if(!(v>0))continue;const due=fatDue(a,fm);
    for(const off of[3,1,0,-1])add(addDays(due,-off),off<=0?0:1,`Fatura ${a.name} (${MES[+fm.slice(5)-1]}) ${WHEN(off)} · ${money(v)}`)}
  const out=Object.keys(by).sort().slice(0,120).map(on=>{const it=by[on].sort((x,y)=>x.pri-y.pri),n=it.length,u=it.filter(i=>!i.pri).length;
    return{on,at:'09',title:n===1?(u?'Conta vencendo':'Lembrete de conta'):`${n} avisos de contas`+(u?` (${u} para hoje)`:''),body:it.slice(0,6).map(i=>i.text).join('\n')+(n>6?`\n…e mais ${n-6}`:'')}});
  if(c.nightly){const hoje=(S.months[ym(t0)]||[]).some(t=>t.date===t0);for(let i=0;i<30;i++){const d=addDays(t0,i);if(i===0&&hoje)continue;out.push({on:d,at:'21',title:'Lançou os gastos de hoje?',body:'Toque para registrar o que você gastou hoje.',url:'./?novo=1'})}}
  return out}
async function pushSchedule(){const list=buildReminders(),plain=JSON.stringify(list);

async function pdfItems(file){const L=await loadPDFJS(),doc=await L.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise,out=[];
  for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p),vp=pg.getViewport({scale:1}),tc=await pg.getTextContent();
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const t=it.transform;if(Math.abs(t[1])>.01||Math.abs(t[2])>.01)continue;

// Leitores de PDF (recibo da 99 e holerite). Recebem itens de texto com posição:
// [{s:'texto', x, y (de cima para baixo), w (largura, opcional), p (página)}]
const MONEY_RE=/^-?(?:R\$\s?)?-?\d{1,3}(?:\.\d{3})*,\d{2}$/;
const toNum=s=>{const neg=/-/.test(s);const v=parseFloat(String(s).replace(/[^\d,]/g,'').replace(',','.'));return neg?-v:v};
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
// quebra cada item em palavras, estimando a posição de cada uma
function tokens(items){const out=[];
  for(const it of items){const s=String(it.s||'').replace(/\s+/g,' ').trim();if(!s)continue;
    const w=it.w>0?it.w:s.length*5.4,cw=w/Math.max(1,s.length);let pos=0;
    for(const part of s.split(' ')){const i=s.indexOf(part,pos);out.push({s:part,x:it.x+i*cw,w:part.length*cw,y:it.y,p:it.p||0});pos=i+part.length}}
  return out}
function lines(items,tol=2.6){const tk=tokens(items).sort((a,b)=>a.p-b.p||a.y-b.y||a.x-b.x),ls=[];
  for(const t of tk){let l=ls.length?ls[ls.length-1]:null;if(!l||l.p!==t.p||Math.abs(t.y-l.y)>tol){l={p:t.p,y:t.y,t:[]};ls.push(l)}l.t.push(t)}
  for(const l of ls){l.t.sort((a,b)=>a.x-b.x);l.text=l.t.map(t=>t.s).join(' ')}
  return ls}

// ---------- 99 ----------
const MES3={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
const DATE99=/(?:dom|seg|ter|qua|qui|sex|s[aá]b)[a-z.]*,?\s*(\d{1,2})\s+(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z.]*,?\s*(\d{4})/i;

  starts.forEach((st,k)=>{const seg=ls.slice(st,k+1<starts.length?starts[k+1]:ls.length),txt=seg.join('\n');
    const dm=seg[0].match(DATE99),date=`${dm[3]}-${String(MES3[nrm(dm[2]).slice(0,3)]).padStart(2,'0')}-${dm[1].padStart(2,'0')}`;
    const money=l=>{const m=l.match(/-?R\$\s?-?[\d.]+,\d{2}/);return m?Math.abs(toNum(m[0])):null};
    let total=null;for(const l of seg)if(/^total\b/i.test(l.trim())&&money(l)!=null){total=money(l);break}
    if(total==null){const tl=seg.find(l=>/valor da corrida/i.test(l));if(tl)total=money(tl)}
    if(total==null)return;
    let pay='',pi=seg.findIndex(l=>/m[eé]todo de pagamento/i.test(l));
    if(pi>=0&&seg[pi+1])pay=seg[pi+1].replace(/-?R\$\s?-?[\d.]+,\d{2}/,'').trim();
    const km=txt.match(/([\d.,]+)\s*km\s*\|\s*(\d+)\s*min/i);
    let cat='';const cm=txt.match(/escolher o\s+(.+)/i);if(cm)cat=cm[1].trim();
    const times=[];seg.forEach((l,i)=>{const m=l.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);if(m){let h=+m[1];if(m[3]){const pm=/pm/i.test(m[3]);if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}times.push({t:String(h).padStart(2,'0')+':'+m[2],addr:(seg[i+1]||'').trim()})}});
    const pay2=nrm(pay),payType=/dinheiro|especie/.test(pay2)?'cash':/pix/.test(pay2)?'pix':/99pay|saldo|carteira/.test(pay2)?'wallet':'card';
    recs.push({src:'99',date,time:times[0]?times[0].t:'',end:times[1]?times[1].t:'',amt:total,pay,payType,km:km?toNum(km[1]+(km[1].includes(',')?'':',0')):null,min:km?+km[2]:null,cat,from:times[0]?times[0].addr:'',to:times[1]?times[1].addr:''})});

// ---------- holerite ----------
const MESES=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DESC_HINT=/inss|irrf|i\.r|imposto|vale|v\.t|desc|emp|emprest|consig|adiant|falta|atraso|contrib|sindic|pens|plano|saude|odont|seguro|coparti|refei|alimenta|farm|cred\.? ?trab/;
function parseHolerite(items){const ls=lines(items);if(!ls.length)return null;
  const all=ls.map(l=>l.text).join('\n'),n=nrm(all);
  const cm=n.match(/(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\s*(?:de|\/)?\s*(\d{4})/);
  const comp=cm?`${cm[2]}-${String(MESES.indexOf(cm[1])+1).padStart(2,'0')}`:'';
  const emp=(ls[0].text.split(/cnpj/i)[0]||'').trim().slice(0,60);
  // cabeçalho da tabela
  const hi=ls.findIndex(l=>/vencimentos/i.test(l.text)&&/descontos/i.test(l.text)&&!/total/i.test(l.text));
  const col=(l,re)=>{const t=l.t.find(t=>re.test(nrm(t.s)));return t?t.x+t.w/2:null};
  let cRef=null,cVen=null,cDes=null;if(hi>=0){cRef=col(ls[hi],/^refer/);cVen=col(ls[hi],/^vencim/);cDes=col(ls[hi],/^descont/)}
  const okCols=cVen!=null&&cDes!=null&&cDes>cVen+20;
  const ti=ls.findIndex((l,i)=>i>hi&&/total de vencimentos/i.test(l.text));
  const end=ti>0?ti:ls.length;
  const rows=[],seen=new Set();
  const st=hi>=0?hi+1:Math.max(0,ls.findIndex(l=>l.t.length&&/^\d{1,5}$/.test(l.t[0].s)&&l.t.some(x=>MONEY_RE.test(x.s))));
  for(let i=st;i<end;i++){const l=ls[i],t=l.t;if(!t.length||!/^\d{1,5}$/.test(t[0].s))continue;
    const nums=t.filter(x=>MONEY_RE.test(x.s)),words=t.slice(1).filter(x=>!MONEY_RE.test(x.s));
    // números da linha de baixo/de cima que ficaram desalinhados (ex.: referência um pouco deslocada)
    if(!nums.length)continue;
    const desc=words.map(x=>x.s).join(' ').trim();if(!desc)continue;
    let ref=null,v=null,kind=null;
    if(okCols){for(const x of nums){const c=x.x+x.w/2,d=[[Math.abs(c-(cRef??-999)),'r'],[Math.abs(c-cVen),'v'],[Math.abs(c-cDes),'d']].sort((a,b)=>a[0]-b[0])[0][1];
        if(d==='r')ref=toNum(x.s);else{v=toNum(x.s);kind=d}}}
    if(v==null){const last=nums[nums.length-1];v=toNum(last.s);if(nums.length>1)ref=toNum(nums[0].s);kind=DESC_HINT.test(nrm(desc).replace(/\./g,''))?'d':'v'}
    const key=t[0].s+'|'+v;if(seen.has(key))continue;seen.add(key);
    rows.push({c:t[0].s,d:desc,ref,v:Math.abs(v),t:kind})}
  // referência que caiu em outra linha (sem código): encaixa na linha anterior sem referência
  const sumV=rows.filter(r=>r.t==='v').reduce((s,r)=>s+r.v,0),sumD=rows.filter(r=>r.t==='d').reduce((s,r)=>s+r.v,0);
  const nearBelow=(re,maxDy=30)=>{for(let i=0;i<ls.length;i++){const lab=ls[i].t.find((_,j,a)=>re.test(nrm(a.slice(j,j+4).map(x=>x.s).join(' '))));if(!lab)continue;
      const cx=lab.x+lab.w/2;let best=null;
      for(let k=i;k<ls.length&&ls[k].y-ls[i].y<=maxDy;k++)for(const x of ls[k].t)if(MONEY_RE.test(x.s)&&!(k===i&&x.x<lab.x-120)){const d=Math.abs(x.x+x.w/2-cx)+(ls[k].y-ls[i].y);if(!best||d<best.d)best={d,v:toNum(x.s)}}
      if(best)return best.v}return null};
  const totV=nearBelow(/^total de vencimentos/),totD=nearBelow(/^total de descontos/);
  let liq=null;for(const l of ls)if(/l[ií]quido/i.test(l.text)){const m=l.t.filter(x=>MONEY_RE.test(x.s));if(m.length){liq=toNum(m[m.length-1].s);break}}
  const fgts=nearBelow(/^f\.?g\.?t\.?s\.?\s*(do\s*)?m/),base=nearBelow(/^salario base/),irrf=nearBelow(/^base calc\.? irrf/);
  const r2=v=>Math.round(v*100)/100,bruto=r2(totV??sumV),desc=r2(totD??sumD),liquido=r2(liq??(bruto-desc));
  const check=Math.abs(sumV-bruto)<.02&&Math.abs(sumD-desc)<.02&&Math.abs(bruto-desc-liquido)<.02;
  return{comp,emp,bruto,desc,liquido,fgts,base,baseIR:irrf,rows,check}}

// ================= RECIBOS 99 / UBER + CONCILIAÇÃO =================
const RC_RE={'99':/(^|[^0-9])99(\s|\*|app|pop|tecnolog|taxi|comfort|$)|noventa e nove/i,uber:/uber/i};
const allRc=()=>Object.values(S.rc).flat();
const rcLabel=r=>(r.src==='99'?'99 ':'Uber ')+(r.cat||'');
const addDaysIso=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
function findTxById(id){for(const k in S.months){const t=S.months[k].find(x=>x.id===id);if(t)return[t,k]}return[null,null]}
function reconcile(){const touched=new Set(),used=new Set();
  for(const t of allTx())if(t.rcid)used.add(t.id);
  // limpa vínculos quebrados
  for(const m in S.rc)for(const r of S.rc[m]){if(r.tx){const[t]=findTxById(r.tx);if(!t||t.rcid!==r.id){delete r.tx;r.m=Date.now();touched.add(m)}}}
  const txs=allTx().filter(t=>t.kind==='d');
  for(const m in S.rc)for(const r of S.rc[m]){if(r.tx)continue;delete r.diff;
    if(r.payType!=='card')continue;
    const lo=addDaysIso(r.date,-1),hi=addDaysIso(r.date,5),kw=RC_RE[r.src];
    const cand=txs.filter(t=>!used.has(t.id)&&!t.rcid&&t.date>=lo&&t.date<=hi);
    const exact=cand.filter(t=>Math.abs(t.amt-r.amt)<=.05&&kw.test(norm2(t.desc))).sort((a,b)=>Math.abs(days2(a.date,r.date))-Math.abs(days2(b.date,r.date)))[0];
    if(exact){r.tx=exact.id;exact.rcid=r.id;used.add(exact.id);r.m=Date.now();touched.add(m);touched.add(ym(exact.date));continue}
    const near=cand.filter(t=>kw.test(norm2(t.desc))&&Math.abs(t.amt-r.amt)/r.amt<=.4).sort((a,b)=>Math.abs(a.amt-r.amt)-Math.abs(b.amt-r.amt))[0];
    if(near){r.diff=near.id;touched.add(m)}}
  touched.forEach(k=>save('m-'+k));return touched.size}
const days2=(a,b)=>Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5);
function confData(scope){const inS=d=>scope==='all'||ym(d)===scope,rcs=allRc().filter(r=>inS(r.date)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const ok=[],diff=[],pend=[],cash=[];
  for(const r of rcs){if(r.tx){const[t]=findTxById(r.tx);if(t&&Math.abs(t.amt-r.amt)>.05)diff.push({r,t});else ok.push({r,t})}
    else if(r.payType!=='card')cash.push({r});else if(r.diff){const[t]=findTxById(r.diff);if(t)diff.push({r,t,sug:1});else pend.push({r})}else pend.push({r})}
  // cobranças de 99/Uber sem recibo, dentro do período coberto pelos recibos de cada app
  const norc=[];for(const src of['99','uber']){const rs=allRc().filter(r=>r.src===src);if(!rs.length)continue;
    const lo=rs.reduce((a,r)=>r.date<a?r.date:a,'9999'),hi=addDaysIso(rs.reduce((a,r)=>r.date>a?r.date:a,''),5);
    for(const t of allTx())if(t.kind==='d'&&!t.rcid&&RC_RE[src].test(norm2(t.desc))&&t.date>=lo&&t.date<=hi&&inS(t.date)&&!diff.some(x=>x.t&&x.t.id===t.id))norc.push({t,src,dup:allTx().some(o=>o!==t&&o.kind==='d'&&o.rcid&&o.date===t.date&&Math.abs(o.amt-t.amt)<=.05)})}
  // gasto com transporte por app no período
  const appTx=allTx().filter(t=>t.kind==='d'&&inS(t.date)&&(t.rcid||RC_RE['99'].test(norm2(t.desc))||RC_RE.uber.test(norm2(t.desc))));
  const total=r2(appTx.reduce((s,t)=>s+t.amt,0)+cash.reduce((s,x)=>s+x.r.amt,0)+pend.reduce((s,x)=>s+x.r.amt,0));
  const rides=appTx.length+cash.length+pend.length,withKm=rcs.filter(r=>r.km>0),km=withKm.reduce((s,r)=>s+r.km,0),kmv=withKm.reduce((s,r)=>s+r.amt,0);
  const per={madrugada:0,manha:0,tarde:0,noite:0};for(const r of rcs)if(r.time){const hh=+r.time.slice(0,2);per[hh<6?'madrugada':hh<12?'manha':hh<18?'tarde':'noite']++}
  return{rcs,ok,diff,pend,cash,norc,total,rides,avg:rides?r2(total/rides):0,perKm:km?r2(kmv/km):0,per}}

    r.tx=t.id;delete r.diff;r.m=Date.now();t.rcid=r.id;t.m=Date.now();save('m-'+ym(r.date));save('m-'+k);openConf();toast('Vinculado.')});

function findDeposit(p){const nm=addMonths(p.comp,1),lo=p.comp+'-20',hi=nm+'-15',r=allTx().filter(t=>t.kind==='r'&&t.date>=lo&&t.date<=hi);
  const ex=r.find(t=>t.ps===p.id)||r.find(t=>Math.abs(t.amt-p.liquido)<=.05);if(ex)return{st:Math.abs(ex.amt-p.liquido)<=.05?'ok':'diff',t:ex};
  const near=r.filter(t=>Math.abs(t.amt-p.liquido)/p.liquido<=.15).sort((a,b)=>Math.abs(a.amt-p.liquido)-Math.abs(b.amt-p.liquido))[0];
  return near?{st:'diff',t:near}:{st:'none'}}
const dGroup=d=>{const n=norm2(d).replace(/\./g,'');return/inss|irrf|imposto|i r\b/.test(n)?'Impostos':/emp|emprest|consig|cred trab/.test(n)?'Empréstimos':/vale|transporte|refei|alimenta|plano|saude|odont|seguro|coparti|farm/.test(n)?'Benefícios':'Outros'};
function openPayslipImport(){

    for(const p of got){const id=p.comp+'|'+norm2(p.emp).slice(0,20),x={id,comp:p.comp,emp:p.emp,bruto:p.bruto,desc:p.desc,liquido:p.liquido,fgts:p.fgts,base:p.base,check:p.check,rows:p.rows};

    :dep.st==='diff'?`<p style="margin:0" class="st-warn"><b>Depósito diferente do líquido</b></p><p class="meta" style="margin:4px 0 0">Caiu ${money(dep.t.amt)} em ${fmtD(dep.t.date)} (${dep.t.amt>p.liquido?'+':'−'}${money(Math.abs(r2(dep.t.amt-p.liquido)))}). Vale perguntar ao RH.</p>`

  ${Object.entries(groups).map(([g,xs])=>`<h3 style="font-size:15px;margin:14px 0 4px">${g} · ${money(r2(xs.reduce((s,x)=>s+x.v,0)))}</h3><ul class="rcl">${xs.map(x=>`<li><div class="r1"><span>${esc(x.d)}</span><b class="neg">−${money(x.v)}</b></div><small>${pct(x.v)} do bruto${x.ref&&x.ref!==x.v?` · referência ${String(x.ref).replace('.',',')}`:''}</small></li>`).join('')}</ul>`).join('')}
  <h3 style="font-size:15px;margin:14px 0 4px">Vencimentos</h3><ul class="rcl">${vs.map(x=>`<li><div class="r1"><span>${esc(x.d)}</span><b class="pos">+${money(x.v)}</b></div></li>`).join('')}</ul>

  ${ps.length>1?`<h3 style="font-size:15px;margin:16px 0 4px">Histórico</h3><table style="width:100%;border-collapse:collapse;font-size:14px">${ps.slice(0,12).map(x=>`<tr style="border-bottom:1px solid var(--line)"><td style="padding:6px 0">${MES[+x.comp.slice(5)-1]}/${x.comp.slice(2,4)}</td><td style="text-align:right">${money(x.bruto)}</td><td style="text-align:right" class="neg">−${money(x.desc)}</td><td style="text-align:right"><b>${money(x.liquido)}</b></td></tr>`).join('')}</table>`:''}
  <button class="btn" id="mkrec" style="width:100%;margin-top:14px">Criar salário e empréstimos como contas fixas</button>
  <div class="row"><button class="btn danger" id="pdel">Excluir</button><button class="btn ghost" data-act="impPay">Importar outro</button><button class="btn" data-act="close">Fechar</button></div>`);

  const l=$('#lanc');if(l)l.onclick=()=>{const c=cfg();if(!c.accounts.length){toast('Cadastre uma conta primeiro.');return}
    const acc=(c.accounts.find(a=>a.type!=='cartao')||c.accounts[0]).id,cat=(c.cats.find(x=>x.id==='salario')||c.cats.find(x=>x.kind==='r')||{}).id;
    openTx(null,{kind:'r',amt:p.liquido,desc:'Salário '+p.emp.split(' ')[0]+' '+MES[+p.comp.slice(5)-1],cat,acc,ps:p.id,date:addMonths(p.comp,1)+'-05'})};
  $('#mkrec').onclick=()=>openPayslipSetup(p,dep);

// ================= AUTOMAÇÕES =================
// lança contas fixas automáticas no vencimento (id fixo por mês: dois aparelhos não duplicam)
function autoPost(){const c=cfg(),t0=today(),cur=curM();let n=0;
  for(const r of c.recur){if(!r.auto||r.payroll)continue;let M=r.since||r.start||cur;if(r.start&&M<r.start)M=r.start;
    for(let g=0;M<=cur&&g<120;M=addMonths(M,1),g++){if(!recActive(r,M))continue;const due=mkDate(M,+r.day);if(due>t0||recPaid(r,M))continue;
      const id='r-'+r.id+'-'+M;if(findTx(id)||(S.dels[M]||[]).includes(id))continue;
      putTx({id,kind:r.kind,amt:r2(r.vary?avgRec(r):+r.amount),desc:r.name,date:due,acc:accOf(r.acc)?r.acc:(c.accounts[0]||{}).id,cat:r.cat,rid:r.id,auto:1});n++}}
  if(n){render();toast(n===1?'1 conta fixa lançada automaticamente.':n+' contas fixas lançadas automaticamente.')}return n}
// ao importar extrato: reconhece pagamentos de contas fixas
function matchRecur(newTx){const c=cfg();let n=0;
  for(const t of newTx){if(t.rid||t.kind==='t')continue;const td=norm(t.desc).split(' ').filter(w=>w.length>=4);
    for(const M of[ym(t.date),addMonths(ym(t.date),-1)]){const r=c.recur.find(r=>{if(r.payroll||r.kind!==t.kind||!recActive(r,M))return false;
        const autoId='r-'+r.id+'-'+M,paidBy=monthTx(M).filter(x=>x.rid===r.id&&x.id!==autoId);if(paidBy.length)return false;
        if(Math.abs(days2(t.date,mkDate(M,+r.day)))>7)return false;const ref=r.vary?avgRec(r):+r.amount,diff=Math.abs(t.amt-ref)/Math.max(ref,1);
        const nameOk=norm(r.name).split(' ').some(w=>w.length>=4&&td.includes(w));return diff<=.02||(nameOk&&diff<=(r.vary?.4:.1))});
      if(r){t.rid=r.id;const auto=findTx('r-'+r.id+'-'+M);if(auto)removeTx(auto.id);n++;break}}}
  return n}
// sugere virar conta fixa o que se repete todo mês
function recurSuggest(){const c=cfg(),M=curM(),ms=[1,2,3,4].map(i=>addMonths(M,-i)),g={},ign=new Set(c.ignSug||[]),out=[];
  for(const k of ms)for(const t of monthTx(k)){if(t.kind==='t'||t.rid||t.inst||t.rcid)continue;const nk=norm(t.desc);if(nk.length<3)continue;(g[t.kind+'|'+nk]=g[t.kind+'|'+nk]||[]).push(t)}
  for(const[key,ts]of Object.entries(g)){const months=[...new Set(ts.map(t=>ym(t.date)))];if(months.length<3||ign.has(key)||ts.length>months.length+1)continue;
    const per=months.map(k=>ts.filter(t=>ym(t.date)===k).reduce((s,t)=>s+t.amt,0)),avg=per.reduce((a,b)=>a+b,0)/per.length;if(per.some(v=>Math.abs(v-avg)/avg>.25))continue;
    if(c.recur.some(r=>norm(r.name)===key.slice(2)))continue;const last=ts.sort((a,b)=>b.date.localeCompare(a.date))[0];
    out.push({key,name:last.desc,amt:r2(avg),day:Math.round(ts.reduce((s,t)=>s+ +t.date.slice(8),0)/ts.length),kind:last.kind,cat:last.cat,acc:last.acc,n:months.length,vary:per.some(v=>Math.abs(v-avg)>.01)})}
  return out.sort((a,b)=>b.amt-a.amt).slice(0,3)}
function vSuggest(){const s=recurSuggest();if(!s.length)return'';
  return`<section class="cf"><span class="lbl" style="opacity:1;color:var(--mute)">Sugestão</span><p style="margin:0 0 6px">Estes pagamentos se repetem todo mês. Quer que eu cuide deles como contas fixas?</p>
  <ul class="rcl">${s.map(x=>`<li><div class="r1"><span>${esc(x.name)}</span><b>${x.vary?'~':''}${money(x.amt)}</b></div><small>Por volta do dia ${x.day} · ${x.n} meses seguidos</small><div class="act"><button class="btn sm" data-sug="${esc(x.key)}">Virar conta fixa</button><button class="btn ghost sm" data-ign="${esc(x.key)}">Ignorar</button></div></li>`).join('')}</ul></section>`}
function bindSuggest(){document.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{const x=recurSuggest().find(s=>s.key===b.dataset.sug);if(x)openRec(null,{name:x.name,amount:x.amt,day:x.day,kind:x.kind,cat:x.cat,acc:x.acc,vary:x.vary})});
  document.querySelectorAll('[data-ign]').forEach(b=>b.onclick=()=>{const c=ensureCfg();c.ignSug=[...(c.ignSug||[]),b.dataset.ign].slice(-200);save('config');render()})}

// ================= ENTRADA INTELIGENTE =================
// "mercado 85,90 ontem no nubank", "recebi 300 do freela", "tênis 600 em 3x no cartão", "uber 23 sexta"
const SMART_STOP=new Set('gastei paguei comprei recebi ganhei entrou caiu pago gasto compra comprinha reais real no na nos nas em com de do da dos das pelo pela um uma o a os as e pra para hoje ontem anteontem dia vezes parcelas parcelado mil cartao credito debito pix dinheiro feira'.split(' '));
function parseSmart(s){const c=cfg(),T=today(),out={},src=String(s||'');let t=' '+norm2(src).replace(/r\$/g,' ')+' ';
  if(/\b(recebi|ganhei|entrou|caiu|salario|reembolso|recebimento)\b/.test(t))out.kind='r';
  let m=t.match(/\b(\d{1,2})\s*x\b|\bem\s+(\d{1,2})\s*(vezes|parcelas)\b|\b(\d{1,2})\s+parcelas\b/);if(m){out.parc=+(m[1]||m[2]||m[4]);t=t.replace(m[0],' ')}
  if(/\banteontem\b/.test(t))out.date=addDays(T,-2);else if(/\bontem\b/.test(t))out.date=addDays(T,-1);else if(/\bhoje\b/.test(t))out.date=T;
  m=t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);if(m){const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):T.slice(0,4);let d=`${y}-${pad(+m[2])}-${pad(+m[1])}`;if(!m[3]&&d>T)d=(+y-1)+d.slice(4);if(+m[2]>=1&&+m[2]<=12)out.date=d;t=t.replace(m[0],' ')}
  m=t.match(/\bdia\s+(\d{1,2})\b/);if(m){let d=mkDate(curM(),+m[1]);if(d>T)d=mkDate(addMonths(curM(),-1),+m[1]);if(!out.date)out.date=d;t=t.replace(m[0],' ')}
  const WD=['domingo','segunda','terca','quarta','quinta','sexta','sabado'];m=t.match(/\b(domingo|segunda|terca|quarta|quinta|sexta|sabado)\b/);
  if(m&&!out.date){const dow=new Date(T+'T12:00').getDay();let back=(dow-WD.indexOf(m[1])+7)%7;if(back===0)back=7;out.date=addDays(T,-back)}
  m=t.match(/(\d+(?:[.,]\d+)?)\s*mil\b/);
  if(m)out.amt=r2(parseFloat(m[1].replace(',','.'))*1000);
  else{m=t.match(/\b\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?\b|\b\d+(?:[.,]\d{1,2})?\b/);if(m){let v=m[0];if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');else if(/\.\d{1,2}$/.test(v))v=v.replace('.',',');const a=num(v);if(a>0)out.amt=r2(a)}}
  let accWords=new Set();for(const a of c.accounts){const an=norm2(a.name).trim();if(an&&t.includes(' '+an+' ')){out.acc=a.id;an.split(' ').forEach(w=>accWords.add(w));break}}
  if(!out.acc){if(/\b(cartao|credito)\b/.test(t)){const k=c.accounts.find(a=>a.type==='cartao');if(k)out.acc=k.id}else if(/\b(pix|debito|dinheiro)\b/.test(t)){const k=c.accounts.find(a=>a.type!=='cartao');if(k)out.acc=k.id}}
  const words=src.replace(/r\$\s*/ig,' ').split(/\s+/).filter(w=>{const n=norm2(w).replace(/[^a-z0-9/.,-]/g,'');if(!n)return false;
    if(SMART_STOP.has(n)||accWords.has(n)||WD.includes(n)||/^\d/.test(n)||/^\d+x$/.test(n)||/^x$/.test(n))return false;return true});
  let desc=words.join(' ').replace(/\s+/g,' ').trim();if(desc)desc=desc[0].toUpperCase()+desc.slice(1);out.desc=desc.slice(0,80);
  for(const cc of c.cats){const cn=norm2(cc.name);if(cn.length>3&&t.includes(cn)&&(!out.kind||cc.kind===out.kind)){out.cat=cc.id;out.kind=out.kind||cc.kind;break}}
  out.kind=out.kind||'d';if(!out.cat&&out.desc)out.cat=guessCat(out.desc,out.kind);
  return out}

function openPayslipSetup(p,dep){const c=cfg();if(!c.accounts.length){toast('Cadastre a conta onde o salário cai.');openAcc(null,'conta');return}
  const loans=p.rows.filter(x=>x.t==='d'&&dGroup(x.d)==='Empréstimos'),ek=norm2(p.emp).replace(/[^a-z]/g,'').slice(0,12);
  const ex=id=>c.recur.find(r=>r.id===id),salId='sal-'+ek,sal=ex(salId);
  const depAcc=dep&&dep.t?dep.t.acc:(c.accounts.find(a=>a.type!=='cartao')||c.accounts[0]).id,depDay=dep&&dep.t?+dep.t.date.slice(8):(sal?sal.day:5);
  const lid=x=>'emp-'+ek+'-'+(x.d.match(/\d{6,}/)||[x.c])[0];
  const left=x=>{const r=ex(lid(x));return r&&r.end?monthsBetween(p.comp,r.end)+1:''};
  sheet(`<form id="f" novalidate><h2>Contas fixas do holerite</h2>
  <p class="hint">Vou cadastrar o salário como receita fixa e cada empréstimo como despesa fixa descontada no holerite. Assim eles aparecem na previsão e nos próximos meses, e o app avisa quando um empréstimo acabar.</p>

  <label class="fld"><span>Conta</span><select name="sa">${accOpts(sal?sal.acc:depAcc,a=>a.type!=='cartao')}</select></label>
  <p class="hint" style="margin-top:-4px">Quando você importar o extrato, o app reconhece o depósito e marca como recebido.</p>
  ${loans.length?`<h3 style="font-size:16px;margin:16px 0 8px">Empréstimos descontados no holerite</h3>`+loans.map((x,i)=>`<div class="card" style="padding:12px"><div class="r1" style="display:flex;justify-content:space-between;gap:8px"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.d)}</b><b class="neg" style="white-space:nowrap">${money(x.v)}</b></div>
    <div class="two" style="margin-top:8px"><label class="fld" style="margin:0"><span>Nome</span><input name="ln${i}" value="${esc((ex(lid(x))||{}).name||('Empréstimo '+(i+1)+' (crédito do trabalhador)'))}" maxlength="40"></label>
