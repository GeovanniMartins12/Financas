  <div class="two"><label class="fld"><span>Nome</span><input name="label" maxlength="24" placeholder="Ex.: Café"></label><label class="fld"><span>Valor (opcional)</span><input name="amt" inputmode="decimal" placeholder="0,00"></label></div>
  <label class="fld"><span>Categoria</span><select name="cat">${c.cats.filter(x=>x.kind==='d').map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label>
  <label class="fld"><span>Conta ou cartão</span><select name="acc">${accOpts()}</select></label>
  <div class="row"><button type="button" class="btn ghost" data-act="close">Fechar</button><button class="btn">Adicionar</button></div></form>`);
  const f=$('#f');f.label.addEventListener('change',()=>{const g=guessCat(f.label.value,'d');if(g)f.cat.value=g});
  f.onsubmit=e=>{e.preventDefault();const label=f.label.value.trim();if(!label){toast('Dê um nome.');return}const v=num(f.amt.value);
    const cc=ensureCfg();cc.quick=cc.quick||[];if(cc.quick.length>=12){toast('Máximo de 12 atalhos.');return}
    cc.quick.push({id:uid(),label,amt:v>0?r2(v):0,cat:f.cat.value,acc:f.acc.value});save('config');render();openQuick();toast('Atalho criado.')};
  document.querySelectorAll('[data-qdel]').forEach(b=>b.onclick=()=>{const cc=ensureCfg();cc.quick=(cc.quick||[]).filter(x=>x.id!==b.dataset.qdel);save('config');render();openQuick()})}

// ================= COMPROMISSOS FUTUROS =================
function planData(){const c=cfg(),M=curM(),rows=[];
  const fixOut=c.recur.filter(r=>r.kind!=='r'),fixIn=c.recur.filter(r=>r.kind==='r');
  for(let i=1;i<=6;i++){const k=addMonths(M,i),tx=monthTx(k).filter(t=>t.kind!=='t'&&!t.rid);
    const parc=tx.filter(t=>t.kind==='d'&&t.inst),other=tx.filter(t=>t.kind==='d'&&!t.inst),inc=tx.filter(t=>t.kind==='r');
    const sp=parc.reduce((s,t)=>s+t.amt,0),sf=fixOut.reduce((s,r)=>s+(+r.amount||0),0),so=other.reduce((s,t)=>s+t.amt,0);
    const si=fixIn.reduce((s,r)=>s+(+r.amount||0),0)+inc.reduce((s,t)=>s+t.amt,0);
    rows.push({k,sp:r2(sp),sf:r2(sf),so:r2(so),out:r2(sp+sf+so),inc:r2(si),items:[...fixOut.map(r=>({n:r.name,v:+r.amount,t:'fixa'})),...parc.map(t=>({n:t.desc,v:t.amt,t:'parcela'})),...other.map(t=>({n:t.desc||catOf(t.cat).name,v:t.amt,t:'agendado'})),...fixIn.map(r=>({n:r.name,v:+r.amount,t:'renda'})),...inc.map(t=>({n:t.desc||catOf(t.cat).name,v:t.amt,t:'renda'}))]})}
  // parcelamentos ativos
  const g={},from=M+'-01';
  for(const t of allTx()){if(!t.inst||t.kind!=='d')continue;const n=t.inst.split('/')[1],base=String(t.desc||'').replace(/\s*\(\d+\/\d+\)\s*$/,'');
    const key=t.grp||(base+'|'+t.acc+'|'+n);(g[key]=g[key]||{base,acc:t.acc,n:+n,list:[]}).list.push(t)}
  const parcs=Object.values(g).map(x=>{const fut=x.list.filter(t=>t.date>=from);if(!fut.length)return null;const last=fut.reduce((a,t)=>t.date>a?t.date:a,'');
    return{base:x.base,acc:x.acc,n:x.n,left:fut.length,per:r2(fut[fut.length-1].amt),rest:r2(fut.reduce((s,t)=>s+t.amt,0)),end:ym(last)}}).filter(Boolean).sort((a,b)=>a.end.localeCompare(b.end));
  return{rows,parcs}}
function vPlan(){const{rows,parcs}=planData();if(!rows.some(r=>r.out||r.inc)&&!parcs.length)return'';
  const mx=Math.max(1,...rows.map(r=>Math.max(r.out,r.inc))),mLab=k=>MES[+k.slice(5)-1]+(k.slice(0,4)!==curM().slice(0,4)?'/'+k.slice(2,4):'');
  return`<section class="blk"><h2>Próximos meses</h2><p class="hint" style="margin-top:-4px">Quanto já está comprometido com contas fixas e parcelas, e quanto sobra da renda prevista. Toque num mês para ver os itens.</p>
  <ul class="plan">${rows.map(r=>{const free=r2(r.inc-r.out),pct=x=>(x/mx*100).toFixed(1);
    return`<li><button data-act="planRow" data-id="${r.k}" aria-expanded="${S.planOpen===r.k?'true':'false'}"><span class="mo">${mLab(r.k)}</span><b class="amt">${money(r.out)}</b><span class="fr ${r.inc?free<0?'neg':'pos':''}">${r.inc?(free<0?'falta ':'sobra ')+money(Math.abs(free)):''}</span>
    <span class="tr2" aria-hidden="true"><i style="width:${pct(r.sp)}%;background:#d9822b"></i><i style="width:${pct(r.sf)}%;background:var(--out)"></i><i style="width:${pct(r.so)}%;background:var(--mute)"></i></span>
    <span class="sub">${[r.sp?'parcelas '+money(r.sp):'',r.sf?'fixas '+money(r.sf):'',r.so?'agendados '+money(r.so):''].filter(Boolean).join(' · ')||'nada comprometido'}${r.inc?' · renda prevista '+money(r.inc):' · sem renda prevista'}</span></button>
    ${S.planOpen===r.k?`<ul class="det">${r.items.map(i=>`<li><span>${esc(i.n)} <small style="color:var(--mute)">${i.t}</small></span><b class="${i.t==='renda'?'pos':''}">${i.t==='renda'?'+':'−'}${money(i.v)}</b></li>`).join('')||'<li>Nada neste mês.</li>'}</ul>`:''}</li>`}).join('')}</ul>
  <p class="legend" style="margin-top:8px;flex-wrap:wrap"><i style="background:#d9822b;margin:0"></i>Parcelas<i class="out"></i>Fixas<i style="background:var(--mute)"></i>Agendados</p>
  ${parcs.length?`<h3 style="font-size:16px;margin:18px 0 4px">Parcelamentos ativos</h3><ul class="parc txs">${parcs.map(x=>`<li><span class="t1">${esc(x.base)}</span><b>${money(x.rest)}</b><small>Faltam ${x.left} de ${x.n} × ${money(x.per)} · termina em ${MES[+x.end.slice(5)-1]}/${x.end.slice(2,4)} · ${esc(accName(x.acc))}</small></li>`).join('')}</ul>`:''}</section>`}

// ================= PREVISÃO DO MÊS =================
function forecast(){const c=cfg(),M=curM(),t0=today(),items=[];
  for(const r of c.recur){if(recPaid(r,M))continue;const a=accOf(r.acc);items.push({date:mkDate(M,+r.day),name:r.name,amt:+r.amount||0,kind:r.kind==='r'?'in':'out',card:!!(a&&a.type==='cartao')})}
  for(const a of c.accounts.filter(a=>a.type==='cartao'))for(const fm of[addMonths(M,-2),addMonths(M,-1),M]){const due=fatDue(a,fm);if(ym(due)!==M||fatPaid(a,fm))continue;const v=fatura(a,fm);if(v>0)items.push({date:due,name:'Fatura '+a.name,amt:v,kind:'fat'})}
  items.sort((x,y)=>x.date.localeCompare(y.date));
  const{r,d}=totals(M),pin=items.filter(i=>i.kind==='in').reduce((s,i)=>s+i.amt,0),pout=items.filter(i=>i.kind==='out').reduce((s,i)=>s+i.amt,0);
  const sobra=r2(r+pin-d-pout),left=dim(M)-(+t0.slice(8))+1;
  const contas=c.accounts.filter(a=>a.type!=='cartao');
  const caixa=r2(contas.reduce((s,a)=>s+balance(a),0)+pin-items.filter(i=>i.kind==='out'&&!i.card).reduce((s,i)=>s+i.amt,0)-items.filter(i=>i.kind==='fat').reduce((s,i)=>s+i.amt,0));
  return{items,sobra,left,perDay:sobra>0?Math.floor(sobra/left*100)/100:0,caixa,hasContas:contas.length>0,t0,M}}
function vForecast(){const c=cfg();if(!c.recur.length&&!c.accounts.some(a=>a.type==='cartao'))return'';
  const f=forecast(),neg=f.sobra<0,end=fmtD(mkDate(f.M,31));
  return`<section class="fc"><span class="lbl" style="opacity:1;color:var(--mute)">Previsão: ${neg?'deve faltar':'deve sobrar'} até ${end}</span>
  <p class="fbig ${neg?'neg':''}">${money(Math.abs(f.sobra))}</p>
  <p>${neg?'As contas que ainda vão vencer passam do que entrou no mês.':f.perDay>0?`Dá para gastar até <b>${money(f.perDay)} por dia</b> nos próximos ${f.left} dia${f.left>1?'s':''}.`:''}</p>
  ${f.hasContas?`<p class="meta" style="color:var(--mute);font-size:14px">Saldo previsto nas contas em ${end}: <b style="color:var(--ink)">${money(f.caixa)}</b></p>`:''}
  ${f.items.length?`<button class="linkbtn" data-act="fcToggle" aria-expanded="${S.fcOpen?'true':'false'}">${S.fcOpen?'Ocultar':'Ver'} o que ainda vence (${f.items.length})</button>
  ${S.fcOpen?`<ul>${f.items.map(i=>`<li><span style="color:${i.date<f.t0?'var(--neg)':'var(--mute)'}">${fmtD(i.date)}</span><span>${esc(i.name)}${i.date<f.t0?' · atrasada':''}</span><b class="${i.kind==='in'?'pos':''}">${i.kind==='in'?'+':'−'}${money(i.amt)}</b></li>`).join('')}</ul>`:''}`:'<p class="hint" style="margin:6px 0 0">Nenhuma conta fixa ou fatura pendente neste mês.</p>'}</section>`}

// ================= APPLE PAY (Atalhos do iPhone) =================
// O Atalho abre: .../Financas/?ap=<valor>|<estabelecimento>|<cartão>
const AP_BASE=location.origin+location.pathname.replace(/index\.html$/,'')+'?ap=';
function matchAcc(card){const c=cfg(),n=norm2(card||'').trim(),words=n.split(/\s+/).filter(w=>w.length>2);
  if(n){const sc=a=>{const an=norm2(a.name).trim();if(!an)return 0;if(n.includes(an)||an.includes(n))return 3;return an.split(/\s+/).some(w=>w.length>2&&words.includes(w))?2:0};
    const best=c.accounts.map(a=>({a,s:sc(a)+(a.type==='cartao'?.5:0)})).filter(x=>x.s>=2).sort((x,y)=>y.s-x.s)[0];if(best)return best.a.id}
  if(c.apAcc&&accOf(c.apAcc))return c.apAcc;const card1=c.accounts.find(a=>a.type==='cartao');return(card1||c.accounts[0]).id}
function handleAp(ap){const parts=String(ap).split('|'),amt=Math.abs(num(parts[0]));
  if(!(amt>0)){toast('Não entendi o valor da compra ('+parts[0]+').');return}
  const c=cfg();if(!c.accounts.length){toast('Cadastre uma conta ou cartão primeiro.');return}
  const desc=String(parts[1]||'Compra Apple Pay').replace(/\s+/g,' ').trim().slice(0,80),t={id:uid(),kind:'d',amt:r2(amt),desc,date:today(),acc:matchAcc(parts[2]),cat:guessCat(desc,'d'),auto:1};
  putTx(t);if(SY.on&&K)schedSync(150);
  S.tab='inicio';S.month=curM();render();
  openTx(t,null,(SY.on&&K?'':'⚠ Este navegador não está conectado à nuvem: o lançamento ficou só aqui. Entre em Contas › Ativar nuvem segura. ')+'Compra no Apple Pay lançada. Confira a categoria e toque em Salvar, ou em Cancelar para manter como está.')}
function handleIncoming(){let q;try{q=new URLSearchParams(location.search)}catch(e){return}
  if(q.get('novo')){try{history.replaceState(null,'',location.pathname)}catch(e){}if(!locked)openTx();return}
  const ap=q.get('ap');if(!ap)return;
  try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
  if(locked){pendingAp=ap;return}handleAp(ap)}
let pendingAp=null;
function openApHelp(){const c=cfg();
  sheet(`<h2>Lançar pelo Apple Pay</h2>
  <p class="hint">Quando você pagar com o iPhone, uma automação abre o app com o valor e o estabelecimento já preenchidos.</p>
  <p class="hint"><b>Antes, uma vez:</b> a automação abre o <b>Safari</b>, não o ícone. Abra o app no Safari e entre na nuvem com sua senha, para o lançamento chegar até aqui.</p>
  <ol class="steps">
  <li>No app <b>Atalhos</b>, abra <b>Automação</b>, toque em <b>+</b> e escolha <b>Transação</b> (Carteira).</li>
  <li>Marque seus cartões, escolha <b>Executar Imediatamente</b> e toque em <b>Seguinte</b> › <b>Nova Automação em Branco</b>.</li>
  <li>Adicione a ação <b>Texto</b> e monte: <b>Quantia</b> | <b>Comerciante</b> | <b>Nome</b> do cartão. Toque no campo, escolha a variável <i>Entrada do Atalho</i> e depois a informação. Separe com a barra vertical <b>|</b>.</li>
  <li>Adicione a ação <b>Codificar URL</b>. Ela usa o Texto automaticamente.</li>
  <li>Adicione <b>Abrir URLs</b> e escreva o endereço abaixo, seguido da variável <i>Texto Codificado em URL</i>:</li></ol>
  <code class="u" id="apurl">${esc(AP_BASE)}</code>
  <div class="row" style="justify-content:flex-start"><button class="btn ghost sm" id="apcopy">Copiar endereço</button><button class="btn ghost sm" data-act="apTest">Simular uma compra</button></div>
  <label class="fld" style="margin-top:14px"><span>Se o nome do cartão não bater com nenhuma conta, lançar em:</span><select id="apacc">${accOpts(c.apAcc||(c.accounts.find(a=>a.type==='cartao')||c.accounts[0]||{}).id)}</select></label>
  <div class="row"><button class="btn" data-act="close">Fechar</button></div>`);
  $('#apcopy').onclick=async()=>{try{await navigator.clipboard.writeText(AP_BASE);toast('Endereço copiado.')}catch(e){toast('Selecione e copie o endereço.')}};
  const s=$('#apacc');if(s)s.onchange=()=>{const cc=ensureCfg();cc.apAcc=s.value;save('config');toast('Salvo.')}}

// ================= BLOQUEIO COM FACE ID =================
const LK=()=>{try{return JSON.parse(localStorage.getItem('fin:lock')||'null')}catch(e){return null}};
let locked=false,hiddenAt=0;
function showLock(){if(!LK())return;locked=true;$('#lock').hidden=false;$('#lockmsg').textContent='';$('#lkform').hidden=true;closeSheet()}
function unlock(){locked=false;$('#lock').hidden=true;document.body.classList.remove('cover');if(pendingAp){const a=pendingAp;pendingAp=null;handleAp(a)}}
async function unlockFace(silent){const l=LK();if(!l)return unlock();
  try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:unb64u(l.id)}],userVerification:'required',timeout:60000}});unlock()}
  catch(e){if(!silent)$('#lockmsg').textContent='Não foi possível confirmar. Tente de novo ou use a senha da nuvem.'}}
async function unlockPass(p){const m=$('#lockmsg');if(!K||!SY.salt){m.textContent='A senha só funciona com a nuvem ativa neste aparelho.';return}
  m.textContent='Conferindo…';try{const k=await deriveKeys(p,SY.salt,SY.iter||ITER);if(k.auth===K.auth){unlock()}else m.textContent='Senha incorreta.'}catch(e){m.textContent='Não consegui conferir a senha.'}}
async function enableLock(){
  if(!SY.on||!K){toast('Ative a nuvem segura antes: a senha dela é a alternativa se o Face ID falhar.');return}
  if(!window.PublicKeyCredential||!navigator.credentials){toast('Este aparelho não permite Face ID aqui.');return}
  try{const cred=await navigator.credentials.create({publicKey:{rp:{name:'Finanças',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'Bloqueio do app Finanças',displayName:'Finanças'},
      challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});
    if(!SY.salt){try{const m=await api('GET','/api/meta',null,false);SY.salt=m.salt;SY.iter=m.iter;saveSY()}catch(e){}}
    localStorage.setItem('fin:lock',JSON.stringify({id:b64u(new Uint8Array(cred.rawId)),at:Date.now()}));render();toast('Bloqueio com Face ID ativado.')}
  catch(e){toast(e&&e.name==='NotAllowedError'?'Cancelado.':'Não consegui ativar ('+((e&&e.name)||'erro')+').')}}
async function disableLock(){if(!await ask('Desativar o bloqueio com Face ID?','Desativar'))return;localStorage.removeItem('fin:lock');render();toast('Bloqueio desativado.')}
function vSecurity(){const on=!!LK(),c=cfg();let th='auto';try{th=localStorage.getItem('fin:theme')||'auto'}catch(e){}
  return`<div class="sec"><div class="hdr"><h2>Aparência</h2></div><div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))">${Object.entries(THEMES).map(([k,l])=>`<label><input type="radio" name="theme" value="${k}" ${th===k?'checked':''}><span>${l}</span></label>`).join('')}</div></div>
  <div class="sec"><div class="hdr"><h2>Segurança</h2></div><div class="card">
  <p style="margin:0">${on?'O app pede Face ID ao abrir e ao voltar depois de 1 minuto fora.':'Peça Face ID para abrir o app. Se alguém pegar seu iPhone desbloqueado, não vê suas finanças.'}</p>
  <div class="act">${on?'<span class="chip ok">Ativo</span><button class="btn ghost sm" data-act="lockOff">Desativar</button>':'<button class="btn sm" data-act="lockOn">Ativar bloqueio com Face ID</button>'}</div>
  <p class="hint" style="margin:12px 0 0">Para esconder os valores das notificações na tela bloqueada: Ajustes › Notificações › Mostrar Pré-visualizações › Quando Desbloqueado.</p></div></div>
  <div class="sec"><div class="hdr"><h2>Apple Pay</h2></div><div class="card"><p style="margin:0">Lance as compras automaticamente quando pagar com o iPhone.</p>
  <div class="act"><button class="btn sm" data-act="apHelp">Configurar</button>${c.accounts.length?'<button class="btn ghost sm" data-act="apTest">Simular compra</button>':''}</div></div></div>`}
function lockInit(){
  if(LK()){showLock();unlockFace(true)}
  $('#lkface').onclick=()=>unlockFace(false);
  $('#lkpass').onclick=()=>{$('#lkform').hidden=false;$('#lkform').p.focus()};
  $('#lkform').onsubmit=e=>{e.preventDefault();unlockPass($('#lkform').p.value)};
  document.addEventListener('visibilitychange',()=>{if(!LK())return;
    if(document.visibilityState==='hidden'){hiddenAt=Date.now();document.body.classList.add('cover')}
    else{if(!locked&&hiddenAt&&Date.now()-hiddenAt>60000){showLock();unlockFace(true)}if(!locked)document.body.classList.remove('cover')}});
}

function useLocal(){S.mode='local';
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!/^fin:(config|m-\d{4}-\d{2})$/.test(k))continue;const b=JSON.parse(localStorage.getItem(k)),id=k.slice(4);if(id==='config')S.cfg=b;else if(id.startsWith('m-')&&b&&Array.isArray(b.tx)){if(b.tx.length)S.months[id.slice(2)]=b.tx;if(Array.isArray(b.del))S.dels[id.slice(2)]=b.del}}}catch(e){}
  try{S.bk=localStorage.getItem('fin:lastbk')||''}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  store={set:async(k,b)=>{try{localStorage.setItem('fin:'+k,JSON.stringify(b))}catch(e){throw{code:e&&e.name==='QuotaExceededError'?'quota_exceeded':'erro'}}},del:async k=>{localStorage.removeItem('fin:'+k)}};
  S.loaded=true;render()}

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
(async()=>{let db=null,id=null;
  try{if(typeof claude!=='undefined'){db=await claude.use('db');const u=await claude.use('user');id=u?await u.id():null}}catch(e){}
  if(!db||!id){lockInit();useLocal();await cloudInit();handleIncoming();return}
  const col=db.collection('data/users/'+id);
  store={set:(k,b)=>col.doc(k).set(b),del:k=>col.doc(k).delete()};S.mode='nuvem';render();
  const tm=setTimeout(()=>{S.note=S.loaded?'Seus dados podem estar desatualizados, sem conexão no momento.':'Ainda não consegui carregar seus dados. Verifique a conexão.';render()},10000);
  col.onSnapshot(snap=>{if(!snap.metadata.fromCache){clearTimeout(tm);S.note=''}
    for(const ch of snap.docChanges()){const d=ch.doc,k=d.id;if(saving[k])continue;
      if(ch.type==='removed'){if(k.startsWith('m-'))delete S.months[k.slice(2)];continue}
      const b=d.data();if(!b)continue;if(k==='config')S.cfg=JSON.parse(JSON.stringify(b));else if(k.startsWith('m-'))S.months[k.slice(2)]=JSON.parse(JSON.stringify(b.tx||[]))}
    if(!S.loaded||$('#sheet').hidden){S.loaded=true;render()}else S.loaded=true},
  e=>{clearTimeout(tm);if(!S.loaded){useLocal();S.note='Não consegui acessar o armazenamento da conta ('+e.code+'). Usando este navegador.'}else S.note='Conexão com seus dados perdida. Recarregue a página.';render()});
})();
}
